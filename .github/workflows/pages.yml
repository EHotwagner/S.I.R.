name: GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  select-qualified-site:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    outputs:
      deploy: ${{ steps.route.outputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
      - name: Download exact route receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-route
          path: artifacts/ci
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: route
        name: Verify route and select deployability
        shell: bash
        run: |
          test '${{ github.event.workflow_run.head_sha }}' = "$(git rev-parse HEAD)"
          node scripts/ci-route.mjs verify-route \
            --route artifacts/ci/route.json \
            --commit '${{ github.event.workflow_run.head_sha }}' \
            --tree "$(git rev-parse 'HEAD^{tree}')"
          if jq -e '.selectedGates | index("documentation")' artifacts/ci/route.json >/dev/null; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

  deploy-qualified-site:
    if: needs.select-qualified-site.outputs.deploy == 'true'
    needs: select-qualified-site
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
      - name: Download exact protected site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: protected-qualified-site
          path: artifacts/qualified-site-handoff
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Extract exact protected site
        run: |
          archive=artifacts/qualified-site-handoff/protected-qualified-site.tar
          while IFS= read -r path; do
            case "$path" in
              artifacts/site|artifacts/site/*|artifacts/ci/route.json|artifacts/ci/results/documentation.json|artifacts/ci/routed-site.receipt.path|artifacts/ci/routed-site-receipts/*.json) ;;
              *) echo "Unexpected qualified-site archive path: $path" >&2; exit 1 ;;
            esac
          done < <(tar -tf "$archive")
          tar -xf "$archive" --no-same-owner
      - name: Verify protected site receipt
        run: |
          test '${{ github.event.workflow_run.head_sha }}' = "$(git rev-parse HEAD)"
          node scripts/ci-route.mjs verify-route \
            --route artifacts/ci/route.json \
            --commit '${{ github.event.workflow_run.head_sha }}' \
            --tree "$(git rev-parse 'HEAD^{tree}')"
          jq -e '.selectedGates | index("documentation")' artifacts/ci/route.json >/dev/null
          jq -e --arg commit '${{ github.event.workflow_run.head_sha }}' --arg route "$(jq -r .digest artifacts/ci/route.json)" \
            '.schema == "sir.ci-gate-result/v1" and .gate == "documentation" and .status == "pass" and .source.commit == $commit and .routeDigest == $route' \
            artifacts/ci/results/documentation.json >/dev/null
          node scripts/qualified-site-handoff.mjs verify \
            --handoff artifacts/qualified-site-handoff/site-handoff.json \
            --route artifacts/ci/route.json \
            --gate artifacts/ci/results/documentation.json \
            --site-receipt "$(<artifacts/ci/routed-site.receipt.path)" \
            --archive artifacts/qualified-site-handoff/protected-qualified-site.tar \
            --commit '${{ github.event.workflow_run.head_sha }}' \
            --tree "$(git rev-parse 'HEAD^{tree}')"
          node scripts/production-build-receipt.mjs verify \
            --owner-command scripts/qualify-pr.sh \
            --receipt "$(<artifacts/ci/routed-site.receipt.path)"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
