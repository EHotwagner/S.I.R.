name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      classification: ${{ steps.route.outputs.classification }}
      rules: ${{ steps.route.outputs.rules }}
      spatial: ${{ steps.route.outputs.spatial }}
      cancellation: ${{ steps.route.outputs.cancellation }}
      cross_runtime: ${{ steps.route.outputs.cross_runtime }}
      browser: ${{ steps.route.outputs.browser }}
      documentation: ${{ steps.route.outputs.documentation }}
      evidence: ${{ steps.route.outputs.evidence }}
      prepare: ${{ steps.route.outputs.prepare }}
      # S.I.R.#304: one per producer, derived by expectedProducersFor() in scripts/ci-route.mjs --
      # the SAME function pr-verdict's join uses to build its expected set. Each prepare-* job below
      # keys its `if:` on its own flag, so "what the workflow runs" and "what the join expects" are
      # two readings of one declaration rather than two hand-maintained lists that can drift.
      prepare_native: ${{ steps.route.outputs.prepare_native }}
      prepare_fable: ${{ steps.route.outputs.prepare_fable }}
      prepare_web: ${{ steps.route.outputs.prepare_web }}
      prepare_docs: ${{ steps.route.outputs.prepare_docs }}
      # S.I.R.#311. Published by the step below -- by THIS file, never by the head's router --
      # so `pr-verdict` can name a stale route contract instead of reporting its consequences.
      contract_drift: ${{ steps.contract.outputs.drift }}
      contract_missing: ${{ steps.contract.outputs.missing }}
      contract_unexpected: ${{ steps.contract.outputs.unexpected }}
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0, cache: npm }
      - id: route
        name: Classify changed paths
        shell: bash
        run: |
          mkdir -p artifacts/ci
          echo "$SIR_CI_RUNNER_START_MS" > artifacts/ci/started-ms
          git diff --name-only '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}' > artifacts/ci/changed-paths.txt
          node scripts/ci-route.mjs route \
            --paths-file artifacts/ci/changed-paths.txt \
            --commit '${{ github.event.pull_request.head.sha }}' \
            --tree "$(git rev-parse '${{ github.event.pull_request.head.sha }}^{tree}')" \
            --output artifacts/ci/route.json \
            --github-output "$GITHUB_OUTPUT"
      # S.I.R.#311. For a `pull_request` GitHub runs THIS workflow from the base branch while
      # executing the head branch's `scripts/`. A contract between the two therefore breaks every
      # branch based before it landed, and said nothing about why: the four `prepare-*` jobs read
      # `needs.route.outputs.prepare_*`, an output the head's router never published reads as the
      # empty string, all four skip, `browser`/`documentation`/`cross-runtime`/`domain-conformance`
      # skip by `needs:` propagation, and `pr-verdict` reports `missing-gate-result` naming four
      # gates the branch never asked to skip. Observed twice on one branch (PRs #298 and #310).
      #
      # The required keys are declared HERE and deliberately NOT derived from `scripts/`. That is
      # the whole point rather than a shortcut: `scripts/` is head-supplied, and a head that
      # predates the contract cannot describe the contract. A detector needing the head's
      # cooperation could not diagnose the only heads it exists for. The same-tree half of this
      # agreement is already asserted by scripts/test-ci-route.mjs, which refuses any
      # `needs.route.outputs.X` this repo's router does not emit; no in-tree suite can reach the
      # cross-revision half, because it has only one revision in the tree.
      - id: contract
        name: State the route outputs this head emitted and check them against this workflow
        shell: bash
        env:
          SIR_ROUTE_EMITTED: ${{ toJSON(steps.route.outputs) }}
          # Exactly the `needs.route.outputs.*` keys this workflow's own job conditions read.
          # `classification` and `prepare` are published but gated on by nothing, so they are not
          # required: a head that omits them breaks no job graph.
          SIR_ROUTE_REQUIRED: >-
            rules spatial cancellation cross_runtime browser documentation evidence
            prepare_native prepare_fable prepare_web prepare_docs
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          let emitted;
          try {
            emitted = JSON.parse(process.env.SIR_ROUTE_EMITTED ?? "");
          } catch (error) {
            // "I could not read this" is never "I read it and it was fine": refuse rather than
            // decide, the same discipline pr-verdict's collection-coverage check applies.
            console.error(`route-contract: the route step's outputs are unreadable (${error.message});`
              + " refusing rather than deciding.");
            process.exit(1);
          }
          if (emitted === null || typeof emitted !== "object" || Array.isArray(emitted)) {
            console.error(`route-contract: the route step's outputs are not an object`
              + ` (got ${emitted === null ? "null" : Array.isArray(emitted) ? "array" : typeof emitted});`
              + " refusing rather than deciding.");
            process.exit(1);
          }
          const required = (process.env.SIR_ROUTE_REQUIRED ?? "").split(/\s+/u).filter(Boolean);
          if (required.length === 0) {
            console.error("route-contract: this workflow declared no required route outputs;"
              + " refusing rather than deciding.");
            process.exit(1);
          }
          const emittedKeys = Object.keys(emitted).sort();
          const producerKeys = emittedKeys.filter((key) => key.startsWith("prepare_"));
          // AC-2: one log states what this head emitted and what this workflow needs, so the
          // mismatch is readable without checking out a second revision of the router.
          console.log(`route-contract: this head's scripts/ci-route.mjs emitted ${emittedKeys.length}`
            + ` route output(s): ${emittedKeys.join(", ") || "(none)"}`);
          console.log(`route-contract: of those, producer keys: ${producerKeys.join(", ") || "(none)"}`);
          console.log(`route-contract: this workflow's job conditions read: ${required.join(", ")}`);
          const missing = required.filter((key) => !(key in emitted));
          // The other direction of the same split: a head whose router emits a producer this
          // workflow has no job for. Nothing runs it, and the head's own join then expects a
          // receipt that could not exist. Same cause, opposite side, so it is named here too --
          // and naming it is what keeps the declared list above from going quietly stale.
          const unexpected = producerKeys.filter((key) => !required.includes(key));
          const write = (key, value) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          write("missing", missing.join(" "));
          write("unexpected", unexpected.join(" "));
          write("drift", String(missing.length > 0 || unexpected.length > 0));
          if (missing.length === 0 && unexpected.length === 0) {
            console.log("route-contract: satisfied -- this head's router publishes every output this workflow gates on.");
            process.exit(0);
          }
          if (missing.length > 0) {
            console.log(`::error title=stale-route-contract::This branch's scripts/ci-route.mjs does not publish`
              + ` ${missing.length} route output(s) this workflow gates on: ${missing.join(", ")}.`
              + " The jobs reading them will skip. See the pr-verdict job for the remedy.");
          }
          if (unexpected.length > 0) {
            console.log(`::error title=unknown-route-contract::This branch's scripts/ci-route.mjs publishes`
              + ` producer key(s) this workflow has no job for: ${unexpected.join(", ")}.`
              + " Nothing will run them. See the pr-verdict job for the remedy.");
          }
          NODE
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: ci-route, path: artifacts/ci, retention-days: 1 }

  integrity:
    if: github.event_name == 'pull_request'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0, cache: npm }
      - run: npm ci --ignore-scripts
      - run: dotnet tool restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/run-ci-gate.sh integrity artifacts/ci/results/integrity.json
      - if: always() && needs.route.outputs.evidence == 'true'
        run: ./scripts/run-ci-gate.sh evidence artifacts/ci/results/evidence.json
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' integrity
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-integrity
          retention-days: 1
          path: artifacts/ci/results

  # Per-PR integrity selection is path-conditional (#248), so a subject that no changed path selects
  # can stay red on the default branch indefinitely with every PR truthfully reporting
  # `measured-omission` (#252). This job is the unconditional counterpart: it never runs on a pull
  # request, so it adds nothing to ordinary PR cost, and it runs every integrity subject on the
  # schedule, on every push to main, and on demand.
  integrity-sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0, cache: npm }
      - run: npm ci --ignore-scripts
      - run: dotnet tool restore
      - name: Route the default branch's own last commit
        shell: bash
        run: |
          mkdir -p artifacts/ci
          # The honest path set for a sweep is what actually last landed on this branch. It is also
          # the point: these are the paths that select nothing, and the sweep runs everything anyway.
          git diff --name-only HEAD~1 HEAD > artifacts/ci/changed-paths.txt || true
          # Degenerate case (root commit, or a commit that changed nothing): the router rejects an
          # empty inventory, so fall back to any tracked path. `sed -n 1p` rather than `head -n 1`
          # deliberately — this step runs under `-o pipefail`, where `head` closing the pipe early
          # SIGPIPEs `git ls-files` and fails the whole step with 141.
          if [[ ! -s artifacts/ci/changed-paths.txt ]]; then
            git ls-files -- '*.md' | sed -n '1p' > artifacts/ci/changed-paths.txt
          fi
          test -s artifacts/ci/changed-paths.txt
          ./scripts/qualify-pr.sh route artifacts/ci/changed-paths.txt
      - name: Run every integrity subject unconditionally
        env:
          SIR_CI_INTEGRITY_SWEEP: "true"
        run: ./scripts/run-ci-gate.sh integrity artifacts/ci/results/integrity.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-integrity-sweep
          retention-days: 30
          path: artifacts/ci/results

  spatial-mutations:
    if: needs.route.outputs.spatial == 'true'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/run-ci-gate.sh spatial-mutations artifacts/ci/results/spatial-mutations.json
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' spatial-mutations
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: gate-spatial-mutations, path: artifacts/ci/results, retention-days: 1 }

  cancellation-mutations:
    if: needs.route.outputs.cancellation == 'true'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0, cache: npm }
      - run: npm ci --ignore-scripts
      - run: dotnet tool restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/run-ci-gate.sh cancellation-mutations artifacts/ci/results/cancellation-mutations.json
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' cancellation-mutations
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: gate-cancellation-mutations, path: artifacts/ci/results, retention-days: 1 }

  prepare-native:
    if: needs.route.outputs.prepare_native == 'true'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/qualify-pr.sh prepare-part native
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-part-native
          compression-level: 0
          retention-days: 1
          path: |
            artifacts/ci/parts/native.tar
            artifacts/ci/parts/native.tar.index.json
            artifacts/ci/parts/native.receipt.path
            artifacts/ci/parts/native.manifest.path
            artifacts/ci/parts/native.timing.json
            artifacts/ci/parts/receipts
            artifacts/ci/parts/manifests
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' prepare-native
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: gate-prepare-native, path: artifacts/ci/results, retention-days: 1 }

  prepare-fable:
    if: needs.route.outputs.prepare_fable == 'true'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/qualify-pr.sh prepare-part fable
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-part-fable
          compression-level: 0
          retention-days: 1
          path: |
            artifacts/ci/parts/fable.tar
            artifacts/ci/parts/fable.tar.index.json
            artifacts/ci/parts/fable.receipt.path
            artifacts/ci/parts/fable.manifest.path
            artifacts/ci/parts/fable.timing.json
            artifacts/ci/parts/receipts
            artifacts/ci/parts/manifests
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' prepare-fable
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: gate-prepare-fable, path: artifacts/ci/results, retention-days: 1 }

  prepare-web:
    if: needs.route.outputs.prepare_web == 'true'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0, cache: npm }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/qualify-pr.sh prepare-part web
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-part-web
          compression-level: 0
          retention-days: 1
          path: |
            artifacts/ci/parts/web.tar
            artifacts/ci/parts/web.tar.index.json
            artifacts/ci/parts/web.receipt.path
            artifacts/ci/parts/web.manifest.path
            artifacts/ci/parts/web.timing.json
            artifacts/ci/parts/receipts
            artifacts/ci/parts/manifests
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' prepare-web
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: gate-prepare-web, path: artifacts/ci/results, retention-days: 1 }

  prepare-docs:
    if: needs.route.outputs.prepare_docs == 'true'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/qualify-pr.sh prepare-part docs
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-part-docs
          compression-level: 0
          retention-days: 1
          path: |
            artifacts/ci/parts/docs.tar
            artifacts/ci/parts/docs.tar.index.json
            artifacts/ci/parts/docs.receipt.path
            artifacts/ci/parts/docs.manifest.path
            artifacts/ci/parts/docs.timing.json
            artifacts/ci/parts/receipts
            artifacts/ci/parts/manifests
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' prepare-docs
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: gate-prepare-docs, path: artifacts/ci/results, retention-days: 1 }

  # S.I.R.#309. This job hosts THREE gates whose parts differ (rules->native, spatial->native+fable,
  # cancellation->native+web), so its `needs:` must statically name the UNION -- but any one route
  # selects only a subset, and GitHub skips a job whose `needs:` were skipped. That is the whole
  # defect: a `domain` route legitimately does not select `web`, `prepare-web` correctly did not run,
  # and this job was skipped with its own `if:` true, so `rules` and `spatial` were never written and
  # `pr-verdict` reported `missing-gate-result` for both. `needs:` is static YAML and cannot be
  # derived at run time; what CAN be derived is PARTICIPATION, and it is derived here from the same
  # `expectedProducersFor` declaration S.I.R.#304 made the single source of producer selection.
  #
  # `!cancelled()` is what lifts GitHub's implicit "every need succeeded" requirement -- without a
  # status-check function the job is skipped before this expression is ever consulted. Lifting it
  # would also let a genuinely FAILED producer through, so each producer is re-admitted explicitly
  # and only when this route did not select it: `prepare_X != 'true'` is the route saying it was
  # never needed, and nothing else satisfies the clause. A producer that ran and failed keeps
  # `prepare_X == 'true'` with a non-success result, and still blocks the job.
  #
  # Index syntax (`needs['prepare-native']`) rather than dot dereference: a hyphenated job id has no
  # precedent anywhere in this repository's workflows, and no linter here can decide whether GitHub's
  # expression parser reads that hyphen as part of the name or as subtraction. Index syntax is
  # unambiguous under either reading, so the question does not need answering.
  domain-conformance:
    if: >-
      !cancelled()
      && needs.route.result == 'success'
      && (needs.route.outputs.rules == 'true' || needs.route.outputs.spatial == 'true' || needs.route.outputs.cancellation == 'true')
      && (needs.route.outputs.prepare_native != 'true' || needs['prepare-native'].result == 'success')
      && (needs.route.outputs.prepare_fable != 'true' || needs['prepare-fable'].result == 'success')
      && (needs.route.outputs.prepare_web != 'true' || needs['prepare-web'].result == 'success')
    needs: [route, prepare-native, prepare-fable, prepare-web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      # Consumption follows the same derived flags as participation. A part this route never
      # prepared has no artifact to download and nothing to extract; asking for it unconditionally
      # would turn the skip this job just stopped being into a red download step instead.
      - if: needs.route.outputs.prepare_native == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: prepared-part-native, path: artifacts/ci/parts }
      - if: needs.route.outputs.prepare_fable == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: prepared-part-fable, path: artifacts/ci/parts }
      - if: needs.route.outputs.prepare_web == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: prepared-part-web, path: artifacts/ci/parts }
      - name: Extract exactly the verified domain inputs this route prepared
        shell: bash
        run: |
          parts=()
          [[ '${{ needs.route.outputs.prepare_native }}' == 'true' ]] && parts+=(native)
          [[ '${{ needs.route.outputs.prepare_fable }}' == 'true' ]] && parts+=(fable)
          [[ '${{ needs.route.outputs.prepare_web }}' == 'true' ]] && parts+=(web)
          # Every gate this job hosts consumes `native`, so an empty set means the route flags and
          # this job's own run condition disagree -- refuse rather than extract nothing and proceed.
          if [[ ${#parts[@]} -eq 0 ]]; then
            echo "domain-conformance: this route prepared none of native/fable/web, yet the job ran." >&2
            exit 1
          fi
          ./scripts/qualify-pr.sh extract-parts "${parts[@]}"
      - name: Run independently receipted domain gates concurrently
        shell: bash
        env:
          PLAYWRIGHT_EXECUTABLE_PATH: /usr/bin/chromium
          SIR_CI_CACHE_HIT: "false"
          SIR_CI_PREFLIGHT_REUSED: "true"
        run: |
          status=0
          gates=()
          [[ '${{ needs.route.outputs.rules }}' == 'true' ]] && gates+=(rules)
          [[ '${{ needs.route.outputs.spatial }}' == 'true' ]] && gates+=(spatial)
          [[ '${{ needs.route.outputs.cancellation }}' == 'true' ]] && gates+=(cancellation)
          pids=()
          for gate in "${gates[@]}"; do
            ./scripts/run-ci-gate.sh "$gate" "artifacts/ci/results/$gate.json" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          if [[ '${{ needs.route.outputs.browser }}' == 'true' ]]; then
            ./scripts/run-ci-gate.sh browser-delivery artifacts/ci/results/browser-delivery.json || status=1
          fi
          exit "$status"
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' domain-conformance
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-domain-conformance
          path: artifacts/ci/results
          if-no-files-found: ignore
          retention-days: 1

