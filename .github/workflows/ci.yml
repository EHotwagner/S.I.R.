name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      rules: ${{ steps.route.outputs.rules }}
      spatial: ${{ steps.route.outputs.spatial }}
      cancellation: ${{ steps.route.outputs.cancellation }}
      cross_runtime: ${{ steps.route.outputs.cross_runtime }}
      browser: ${{ steps.route.outputs.browser }}
      documentation: ${{ steps.route.outputs.documentation }}
      evidence: ${{ steps.route.outputs.evidence }}
      prepare: ${{ steps.route.outputs.prepare }}
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 26.5.0, cache: npm }
      - id: route
        name: Classify changed paths
        shell: bash
        run: |
          mkdir -p artifacts/ci
          echo "$SIR_CI_RUNNER_START_MS" > artifacts/ci/started-ms
          git diff --name-only '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}' > artifacts/ci/changed-paths.txt
          node scripts/ci-route.mjs route \
            --paths-file artifacts/ci/changed-paths.txt \
            --commit '${{ github.event.pull_request.head.sha }}' \
            --tree "$(git rev-parse '${{ github.event.pull_request.head.sha }}^{tree}')" \
            --output artifacts/ci/route.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: ci-route, path: artifacts/ci, retention-days: 1 }

  integrity:
    if: github.event_name == 'pull_request'
    needs: route
    runs-on: ubuntu-latest
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v4
        with: { node-version: 26.5.0, cache: npm }
      - run: npm ci --ignore-scripts
      - run: dotnet tool restore
      - uses: actions/download-artifact@v4
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/run-ci-gate.sh integrity artifacts/ci/results/integrity.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gate-integrity, path: artifacts/ci/results/integrity.json, retention-days: 1 }

  prepare:
    if: needs.route.outputs.prepare == 'true'
    needs: route
    runs-on: ubuntu-latest
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v4
        with: { node-version: 26.5.0, cache: npm }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/run-ci-gate.sh prepare artifacts/ci/results/prepare.json
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-candidate
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          path: |
            artifacts/ci
            artifacts/prepared-candidate.tar
            docs/evidence/production-build-receipt-v1
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gate-prepare, path: artifacts/ci/results/prepare.json, retention-days: 1 }

  rules:
    if: needs.route.outputs.rules == 'true'
    needs: [route, integrity, prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v4
        with: { node-version: 26.5.0 }
      - id: nuget-cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props', '.config/dotnet-tools.json') }}
      - uses: actions/download-artifact@v4
        with: { name: prepared-candidate, path: . }
      - run: ./scripts/qualify-pr.sh extract-prepared
      - run: ./scripts/run-ci-gate.sh rules artifacts/ci/results/rules.json
        env: { SIR_CI_CACHE_HIT: "${{ steps.nuget-cache.outputs.cache-hit == 'true' }}" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gate-rules, path: artifacts/ci/results/rules.json, retention-days: 1 }

  spatial:
    if: needs.route.outputs.spatial == 'true'
    needs: [route, integrity, prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v4
        with: { node-version: 26.5.0 }
      - id: nuget-cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props', '.config/dotnet-tools.json') }}
      - uses: actions/download-artifact@v4
        with: { name: prepared-candidate, path: . }
      - run: ./scripts/qualify-pr.sh extract-prepared
      - run: ./scripts/run-ci-gate.sh spatial artifacts/ci/results/spatial.json
        env: { SIR_CI_CACHE_HIT: "${{ steps.nuget-cache.outputs.cache-hit == 'true' }}" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gate-spatial, path: artifacts/ci/results/spatial.json, retention-days: 1 }

  cancellation:
    if: needs.route.outputs.cancellation == 'true'
    needs: [route, integrity, prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v4
        with: { node-version: 26.5.0, cache: npm }
      - id: nuget-cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props', '.config/dotnet-tools.json') }}
      - run: npm ci --ignore-scripts
      - run: dotnet tool restore
      - uses: actions/download-artifact@v4
        with: { name: prepared-candidate, path: . }
      - run: ./scripts/qualify-pr.sh extract-prepared
      - run: ./scripts/run-ci-gate.sh cancellation artifacts/ci/results/cancellation.json
        env: { SIR_CI_CACHE_HIT: "${{ steps.nuget-cache.outputs.cache-hit == 'true' }}" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gate-cancellation, path: artifacts/ci/results/cancellation.json, retention-days: 1 }

  cross-runtime:
    if: needs.route.outputs.cross_runtime == 'true'
    needs: [route, integrity, prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v4
        with: { node-version: 26.5.0, cache: npm }
      - id: nuget-cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props', '.config/dotnet-tools.json') }}
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with: { name: prepared-candidate, path: . }
      - run: ./scripts/qualify-pr.sh extract-prepared
      - run: ./scripts/run-ci-gate.sh cross-runtime artifacts/ci/results/cross-runtime.json
        env:
          PLAYWRIGHT_EXECUTABLE_PATH: /usr/bin/chromium
          SIR_CI_CACHE_HIT: "${{ steps.nuget-cache.outputs.cache-hit == 'true' }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gate-cross-runtime, path: artifacts/ci/results/cross-runtime.json, retention-days: 1 }

  browser:
    if: needs.route.outputs.browser == 'true'
    needs: [route, integrity, prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 26.5.0, cache: npm }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with: { name: prepared-candidate, path: . }
      - run: ./scripts/qualify-pr.sh extract-prepared
      - run: ./scripts/run-ci-gate.sh browser artifacts/ci/results/browser.json
        env: { PLAYWRIGHT_EXECUTABLE_PATH: /usr/bin/chromium }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gate-browser, path: artifacts/ci/results/browser.json, retention-days: 1 }

  documentation:
    if: needs.route.outputs.documentation == 'true'
    needs: [route, integrity, prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v4
        with: { node-version: 26.5.0, cache: npm }
      - id: nuget-cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props', '.config/dotnet-tools.json') }}
      - run: npm ci --ignore-scripts
      - run: dotnet tool restore
      - uses: actions/download-artifact@v4
        with: { name: prepared-candidate, path: . }
      - run: ./scripts/qualify-pr.sh extract-prepared
      - run: ./scripts/run-ci-gate.sh documentation artifacts/ci/results/documentation.json
        env: { SIR_CI_CACHE_HIT: "${{ steps.nuget-cache.outputs.cache-hit == 'true' }}" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gate-documentation, path: artifacts/ci/results/documentation.json, retention-days: 1 }

  evidence:
    if: needs.route.outputs.evidence == 'true'
    needs: [route, integrity]
    runs-on: ubuntu-latest
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v4
        with: { node-version: 26.5.0, cache: npm }
      - id: nuget-cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props', '.config/dotnet-tools.json') }}
      - run: npm ci --ignore-scripts
      - run: dotnet tool restore
      - uses: actions/download-artifact@v4
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/run-ci-gate.sh evidence artifacts/ci/results/evidence.json
        env: { SIR_CI_CACHE_HIT: "${{ steps.nuget-cache.outputs.cache-hit == 'true' }}" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gate-evidence, path: artifacts/ci/results/evidence.json, retention-days: 1 }

  pr-verdict:
    if: always() && github.event_name == 'pull_request'
    needs: [route, integrity, prepare, rules, spatial, cancellation, cross-runtime, browser, documentation, evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 26.5.0 }
      - uses: actions/download-artifact@v4
        with: { name: ci-route, path: artifacts/ci }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: gate-*, path: artifacts/ci/results, merge-multiple: true }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: prepared-candidate, path: prepared }
      - name: Join required gate receipts
        shell: bash
        run: |
          args=()
          for gate in integrity prepare rules spatial cancellation cross-runtime browser documentation evidence; do
            if [[ -f "artifacts/ci/results/$gate.json" ]]; then args+=(--result "$gate=artifacts/ci/results/$gate.json"); fi
          done
          manifest_args=()
          if [[ -f prepared/artifacts/ci/artifact-manifest.path ]]; then
            manifest_args+=(--artifact-manifest "prepared/$(<prepared/artifacts/ci/artifact-manifest.path)")
          fi
          node scripts/ci-route.mjs join \
            --route artifacts/ci/route.json \
            "${args[@]}" \
            "${manifest_args[@]}" \
            --started-ms "$(<artifacts/ci/started-ms)" \
            --completed-ms "$(date +%s%3N)" \
            --output artifacts/ci/pr-verdict.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: pr-verdict, path: artifacts/ci/pr-verdict.json, retention-days: 30 }

  full-qualification:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v4
        with: { node-version: 26.5.0, cache: npm }
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props', '.config/dotnet-tools.json') }}
      - run: npm ci --ignore-scripts
      - run: dotnet tool restore
      - run: ./scripts/test-ci-scheduled-full-mutation.sh
      - run: ./scripts/qualify-production.sh --protected
        env: { PLAYWRIGHT_EXECUTABLE_PATH: /usr/bin/chromium }
