  pr-verdict:
    if: always() && github.event_name == 'pull_request'
    needs: [route, integrity, prepare-native, prepare-fable, prepare-web, prepare-docs, spatial-mutations, cancellation-mutations, browser-general-helper, browser-delivery, domain-conformance, cross-runtime, browser, documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with: { pattern: gate-*, path: artifacts/ci/results, merge-multiple: true }
      # A gate result written on the runner but never collected is indistinguishable from a gate that
      # never ran, so the evidence chain cannot tell "no finding" from "no observation" (#282). Each
      # gate job records what it produced under artifacts/ci/results. This second download keeps each
      # gate artifact separate (the merged one above cannot tell which artifact a file came from, so a
      # job whose upload dropped its own record would vanish from a merged view rather than be caught).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with: { pattern: gate-*, path: artifacts/ci/gates }
      - name: Verify every produced gate result was collected
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = "artifacts/ci/gates";

          // Which files a record claims were produced but are absent from the same artifact.
          const missingFrom = (produced, present) => produced.filter((f) => !present.includes(f));

          // Self-test: prove on every run that this comparison can still report a drop. A check that
          // has never been red is equally consistent with "nothing was wrong" and "it cannot fire".
          if (missingFrom(["a.json"], ["a.json"]).length !== 0
              || missingFrom(["a.json", "b.json"], ["a.json"]).join() !== "b.json") {
            console.error("collection-coverage: self-test failed; the comparison cannot detect a dropped result.");
            process.exit(1);
          }

          if (!fs.existsSync(root)) {
            console.error(`collection-coverage: ${root} is absent, so no gate artifact was collected at all.`);
            console.error("This is a refusal, not a pass: an unobservable gate is not a passing gate.");
            process.exit(1);
          }

          // download-artifact gives each artifact its own directory -- EXCEPT when exactly one artifact
          // matches the pattern, which it extracts flat into the path (src/download-artifact.ts:
          // `isSingleArtifactDownload || inputs.mergeMultiple || artifacts.length === 1`). That third
          // clause is not in the action's README. A one-gate route (evidence-only runs only integrity)
          // therefore lands flat, and reading only subdirectories would refuse a legitimate run.
          const entries = fs.readdirSync(root, { withFileTypes: true });
          const dirs = entries.filter((e) => e.isDirectory()).map((e) => e.name).sort();
          const loose = entries.filter((e) => e.isFile()).map((e) => e.name).sort();
          let units;
          if (dirs.length > 0 && loose.length > 0) {
            console.error(`collection-coverage: ${root} holds both artifact directories (${dirs.join(", ")})`
              + ` and loose files (${loose.join(", ")}); this layout is unrecognised, so refusing rather than deciding.`);
            process.exit(1);
          } else if (dirs.length > 0) {
            units = dirs.map((d) => ({ label: d, dir: path.join(root, d) }));
          } else if (loose.length > 0) {
            units = [{ label: "(single gate artifact, extracted flat)", dir: root }];
          } else {
            console.error(`collection-coverage: no gate-* artifact arrived under ${root}; refusing rather than deciding.`);
            process.exit(1);
          }

          const failures = [];
          for (const unit of units) {
            const present = fs.readdirSync(unit.dir)
              .filter((n) => fs.statSync(path.join(unit.dir, n)).isFile()).sort();
            const records = present.filter((n) => /^collected-.+\.json$/.test(n));
            if (records.length !== 1) {
              failures.push(`${unit.label}: expected exactly one collected-<job>.json record, found ${records.length}.`
                + " That job's upload-artifact step is not collecting artifacts/ci/results as a directory.");
              continue;
            }
            let record;
            try {
              record = JSON.parse(fs.readFileSync(path.join(unit.dir, records[0]), "utf8"));
            } catch (error) {
              failures.push(`${unit.label}: record ${records[0]} is unreadable (${error.message}); refusing rather than deciding.`);
              continue;
            }
            if (typeof record?.job !== "string" || !Array.isArray(record?.produced)
                || !record.produced.every((f) => typeof f === "string")) {
              failures.push(`${unit.label}: record ${records[0]} is malformed; refusing rather than deciding.`);
              continue;
            }
            console.log(`  ${unit.label} (job ${record.job}): produced ${record.produced.length}`
              + ` -> ${record.produced.join(", ") || "(none)"}`);
            for (const f of missingFrom(record.produced, present)) {
              failures.push(`${unit.label}: produced ${f}, never collected.`);
            }
          }

          console.log(`collection-coverage: ${units.length} gate artifact(s) inspected.`);
          if (failures.length > 0) {
            console.error("collection-coverage: gate results were produced on the runner and never collected:");
            for (const f of failures) console.error(`  ${f}`);
            console.error("Collect artifacts/ci/results as a directory in that job's upload-artifact step.");
            process.exit(1);
          }
          console.log("collection-coverage: every produced gate result was collected.");
          NODE
      # S.I.R.#311. Runs BEFORE the join, because on a branch whose router predates this
      # workflow's producer contract the join's `missing-gate-result` is a consequence and not the
      # cause: it names `browser`, `documentation`, `cross-runtime` and `domain-conformance`, none
      # of which the branch asked to skip, and says nothing about the router. This step names the
      # cause, and separates it from gates that genuinely ran and genuinely failed -- so a branch
      # that is merely too old and a branch that is actually broken do not report the same thing.
      - name: Name a stale route contract before reading the receipts
        shell: bash
        env:
          SIR_ROUTE_CONTRACT_DRIFT: ${{ needs.route.outputs.contract_drift }}
          SIR_ROUTE_CONTRACT_MISSING: ${{ needs.route.outputs.contract_missing }}
          SIR_ROUTE_CONTRACT_UNEXPECTED: ${{ needs.route.outputs.contract_unexpected }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const drift = process.env.SIR_ROUTE_CONTRACT_DRIFT ?? "";
          // A route job that never reported is not a route job that reported "no drift". The
          // check is declared by THIS file, so an empty value means the route job did not run
          // this step at all -- refuse rather than decide.
          if (drift === "") {
            console.error("route-contract: the route job published no contract verdict; refusing rather than deciding."
              + " Inspect the route job's \"State the route outputs this head emitted\" step.");
            process.exit(1);
          }
          if (drift !== "true") {
            console.log("route-contract: satisfied -- this head's router publishes every output this workflow gates on.");
            process.exit(0);
          }
          const missing = (process.env.SIR_ROUTE_CONTRACT_MISSING ?? "").split(/\s+/u).filter(Boolean);
          const unexpected = (process.env.SIR_ROUTE_CONTRACT_UNEXPECTED ?? "").split(/\s+/u).filter(Boolean);
          const say = (line) => console.error(line);
          say("");
          say("=========================== STALE ROUTE CONTRACT ===========================");
          say("");
          say("This run did not fail because a gate found a defect. It failed because this");
          say("branch's scripts/ci-route.mjs and this workflow disagree about the route");
          say("outputs the pipeline is wired on.");
          say("");
          say("For a `pull_request`, GitHub runs .github/workflows/ci.yml from the BASE branch");
          say("and executes scripts/ from the HEAD branch. This branch is based before the");
          say("contract that the base's workflow now gates on, so:");
          say("");
          if (missing.length > 0) {
            say(`  * this branch's router never publishes: ${missing.join(", ")}`);
            say("  * every job whose `if:` reads one of those sees the empty string and SKIPS");
            say("  * that skip propagates through `needs:` to their consumers");
            say("  * the join then reports those receipts missing, naming gates this branch");
            say("    never asked to skip");
          }
          if (unexpected.length > 0) {
            say(`  * this branch's router publishes producer key(s) the base workflow has no job`);
            say(`    for: ${unexpected.join(", ")} -- so nothing runs them, and this branch's own`);
            say("    join then expects a receipt that could not have been produced");
          }
          say("");
          say("Do NOT repair the gates the join names below. They are consequences. Nothing is");
          say("wrong with them, and changing them will not make this run pass.");
          say("");
          say("--------------------------------- REMEDY -----------------------------------");
          say("");
          say("Take the base's contract onto this branch. WHICH command depends on one");
          say("condition, and the reflex answer is wrong about half the time:");
          say("");
          say("  Does anything COMMITTED on this branch cite this branch's OWN commit SHAs?");
          say("  Report front-matter `commit:` fields, an audit ledger binding a commit, an");
          say("  evidence receipt anchored to a suite run, and a review marker naming an exact");
          say("  head are all such citations.");
          say("");
          say("    YES -> git fetch origin && git merge origin/main");
          say("           A rebase rewrites every commit on this branch, which turns each of");
          say("           those citations into a claim about a commit that no longer exists.");
          say("           Merging leaves the cited commits reachable and the citations true.");
          say("");
          say("    NO  -> git fetch origin && git rebase origin/main");
          say("           Nothing on the branch depends on its own commit identities, so a");
          say("           linear history costs nothing.");
          say("");
          say("Either way, push and re-run. This message disappears when the branch's router");
          say("publishes what the base's workflow gates on.");
          say("");
          // The receipts that DID arrive are still evidence. A branch can be both too old and
          // genuinely broken; reporting only the first would hide the second behind a rebase.
          const root = "artifacts/ci/results";
          const genuine = [];
          let readable = true;
          try {
            for (const name of fs.readdirSync(root).sort()) {
              if (!name.endsWith(".json")) continue;
              let result;
              try {
                result = JSON.parse(fs.readFileSync(path.join(root, name), "utf8"));
              } catch {
                genuine.push(`${name} (unreadable -- not counted as passing)`);
                continue;
              }
              if (result?.status !== undefined && result.status !== "pass") {
                const stage = typeof result.failureStage === "string" ? `, failureStage: ${result.failureStage}` : "";
                genuine.push(`${result.gate ?? name} (status: ${result.status}${stage})`);
              }
            }
          } catch {
            readable = false;
          }
          say("---------------------- GATES THAT RAN ON THIS BRANCH ------------------------");
          say("");
          if (!readable) {
            say("  No gate receipts were collected, so nothing can be said about them here.");
          } else if (genuine.length === 0) {
            say("  Every gate that ran reported pass. Nothing here needs repair; this branch");
            say("  needs its base, not a fix.");
          } else {
            say("  These gates RAN and FAILED. They are independent of the contract drift above");
            say("  and will still be failing after you take the base -- repair them as well:");
            say("");
            for (const entry of genuine) say(`    * ${entry}`);
          }
          say("");
          say("============================================================================");
          const codes = [missing.length > 0 ? "stale-route-contract" : null,
            unexpected.length > 0 ? "unknown-route-contract" : null].filter(Boolean);
          console.log(`::error title=${codes[0]}::pr-verdict: ${codes.join(" + ")} --`
            + " this branch's router and the base's workflow disagree on the route outputs the"
            + " pipeline is wired on. See this step's log for the deciding merge-vs-rebase condition.");
          process.exit(1);
          NODE
      - name: Join required gate receipts
        shell: bash
        run: |
          if node -e 'const route=require("./artifacts/ci/route.json"); process.exit(route.selectedGates.includes("browser") ? 0 : 1)'; then
            set +e
            node scripts/test-browser-global-merge.mjs \
              artifacts/ci/results/browser-general.junit.xml \
              artifacts/ci/results/browser-general-1.junit.xml \
              artifacts/ci/results/browser-general-2.junit.xml \
              artifacts/ci/results/browser-general-3.junit.xml \
              artifacts/ci/results/browser-general-4.junit.xml
            browser_merge_status=$?
            set -e
            if [[ $browser_merge_status -ne 0 ]]; then
              rm -f artifacts/ci/results/browser-general-helper.json
            fi
          fi
          args=()
          for gate in integrity prepare-native prepare-fable prepare-web prepare-docs spatial-mutations cancellation-mutations browser-general-helper browser-delivery rules spatial cancellation cross-runtime browser documentation evidence; do
            if [[ -f "artifacts/ci/results/$gate.json" ]]; then args+=(--result "$gate=artifacts/ci/results/$gate.json"); fi
          done
          node scripts/ci-route.mjs join \
            --route artifacts/ci/route.json \
            "${args[@]}" \
            --started-ms "$(<artifacts/ci/started-ms)" \
            --completed-ms "$(date +%s%3N)" \
            --output artifacts/ci/pr-verdict.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: pr-verdict, path: artifacts/ci/pr-verdict.json, retention-days: 30 }

  protected-preflight:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0, cache: npm }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props', '.config/dotnet-tools.json') }}
      - run: npm ci --ignore-scripts
      - run: dotnet tool restore
      - name: Run protected preflight
        run: ./scripts/run-protected-stage.sh preflight artifacts/qualification/stages/preflight.json -- ./scripts/qualify-protected-preflight.sh
        env:
          SIR_PROTECTED_SCHEDULED: ${{ github.event_name == 'schedule' }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: protected-stage-preflight, path: artifacts/qualification/stages/preflight.json, retention-days: 30 }

  cost-observer:
    if: always() && github.event_name == 'pull_request'
    needs: pr-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: gate-*
          path: artifacts/observed/gates
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with: { name: pr-verdict, path: artifacts/observed/pr-verdict }
      - name: Reconcile complete run cost
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          node scripts/ci-cost-report.mjs observe \
            --repository '${{ github.repository }}' \
            --run-id '${{ github.run_id }}' \
            --expected-head '${{ github.event.pull_request.head.sha }}' \
            --expected-attempt '${{ github.run_attempt }}' \
            --active-observer-job-name cost-observer \
            --receipts artifacts/observed \
            --output artifacts/ci-cost/report.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: ci-cost-report, path: artifacts/ci-cost/report.json, retention-days: 90 }

  full-qualification:
    if: github.event_name != 'pull_request'
    needs: protected-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0, cache: npm }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props', '.config/dotnet-tools.json') }}
      - run: npm ci --ignore-scripts
      - run: dotnet tool restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: protected-stage-preflight, path: artifacts/qualification/stages }
      - name: Run protected core qualification
        run: ./scripts/run-protected-stage.sh core artifacts/qualification/stages/core.json -- ./scripts/qualify-production.sh --protected
        env:
          PLAYWRIGHT_EXECUTABLE_PATH: /usr/bin/chromium
          SIR_PROTECTED_PREFLIGHT_RECEIPT: artifacts/qualification/stages/preflight.json
      - name: Stage qualified-site receipt
        if: success()
        run: |
          source_receipt=$(<artifacts/qualification/site-receipt.path)
          build_receipt=$(<artifacts/qualification/build-receipt.path)
          conformance_receipt=$(<artifacts/qualification/conformance-receipt.path)
          handoff=artifacts/qualified-site-handoff
          rm -rf -- "$handoff"
          mkdir -p "$handoff"
          tar -cf "$handoff/protected-qualified-site.tar" -- \
            artifacts/site \
            artifacts/qualification/single-pass-timing.json \
            artifacts/qualification/site-receipt.path \
            "$source_receipt" \
            "$build_receipt" \
            "$conformance_receipt"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: protected-stage-core, path: artifacts/qualification/stages/core.json, retention-days: 30 }
      - if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-qualified-site
          retention-days: 30
          path: artifacts/qualified-site-handoff

  protected-verdict:
    if: always() && github.event_name != 'pull_request'
    needs: [protected-preflight, full-qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with: { pattern: protected-stage-*, path: artifacts/qualification/stages, merge-multiple: true }
      - name: Join protected stage receipts
        run: |
          args=()
          for stage in preflight core; do
            if [[ -f "artifacts/qualification/stages/$stage.json" ]]; then args+=(--receipt "$stage=artifacts/qualification/stages/$stage.json"); fi
          done
          node scripts/protected-stage-receipt.mjs join "${args[@]}" --output artifacts/qualification/protected-verdict.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: protected-verdict, path: artifacts/qualification/protected-verdict.json, retention-days: 90 }
