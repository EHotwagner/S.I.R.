name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cross-runtime-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - run: dotnet tool restore
      - run: npm ci
      - run: node .github/scripts/test-npm-audit.mjs
      - run: node .github/scripts/check-npm-audit.mjs
      - run: ./scripts/verify-fable-game-governance.sh
      - run: dotnet fsgg-sdd dependency-surface --check --param packageId=FS.GG.Game.Core --param version=0.13.0 --root . --text
      - run: ./scripts/verify-rules-corpus.sh
      - run: ./scripts/test-conformance.sh
      - run: dotnet restore SIR.slnx --locked-mode
      - run: npm run verify:scaffold
      - run: dotnet publish src/SIR.Server/SIR.Server.fsproj -c Release --no-restore -o artifacts/publish
      - run: npm run test:browser
        env:
          PLAYWRIGHT_EXECUTABLE_PATH: /usr/bin/chromium
      - run: dotnet fsgg-sdd evidence --work 138-sir-fable-game-scaffold --sync-observed-run artifacts/test-results/browser.junit.xml --root . --text
      - run: dotnet fsgg-sdd verify --work 138-sir-fable-game-scaffold --root . --text
      - run: dotnet fsgg-sdd doctor --root . --text

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - run: npm ci
      - run: node .github/scripts/check-npm-audit.mjs
      - run: ./scripts/build-docs.sh
