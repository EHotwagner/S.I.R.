name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      classification: ${{ steps.route.outputs.classification }}
      rules: ${{ steps.route.outputs.rules }}
      spatial: ${{ steps.route.outputs.spatial }}
      cancellation: ${{ steps.route.outputs.cancellation }}
      cross_runtime: ${{ steps.route.outputs.cross_runtime }}
      browser: ${{ steps.route.outputs.browser }}
      documentation: ${{ steps.route.outputs.documentation }}
      evidence: ${{ steps.route.outputs.evidence }}
      prepare: ${{ steps.route.outputs.prepare }}
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0, cache: npm }
      - id: route
        name: Classify changed paths
        shell: bash
        run: |
          mkdir -p artifacts/ci
          echo "$SIR_CI_RUNNER_START_MS" > artifacts/ci/started-ms
          git diff --name-only '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}' > artifacts/ci/changed-paths.txt
          node scripts/ci-route.mjs route \
            --paths-file artifacts/ci/changed-paths.txt \
            --commit '${{ github.event.pull_request.head.sha }}' \
            --tree "$(git rev-parse '${{ github.event.pull_request.head.sha }}^{tree}')" \
            --output artifacts/ci/route.json \
            --github-output "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: ci-route, path: artifacts/ci, retention-days: 1 }

  integrity:
    if: github.event_name == 'pull_request'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0, cache: npm }
      - run: npm ci --ignore-scripts
      - run: dotnet tool restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/run-ci-gate.sh integrity artifacts/ci/results/integrity.json
      - if: always() && needs.route.outputs.evidence == 'true'
        run: ./scripts/run-ci-gate.sh evidence artifacts/ci/results/evidence.json
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' integrity
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-integrity
          retention-days: 1
          path: artifacts/ci/results

  # Per-PR integrity selection is path-conditional (#248), so a subject that no changed path selects
  # can stay red on the default branch indefinitely with every PR truthfully reporting
  # `measured-omission` (#252). This job is the unconditional counterpart: it never runs on a pull
  # request, so it adds nothing to ordinary PR cost, and it runs every integrity subject on the
  # schedule, on every push to main, and on demand.
  integrity-sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0, cache: npm }
      - run: npm ci --ignore-scripts
      - run: dotnet tool restore
      - name: Route the default branch's own last commit
        shell: bash
        run: |
          mkdir -p artifacts/ci
          # The honest path set for a sweep is what actually last landed on this branch. It is also
          # the point: these are the paths that select nothing, and the sweep runs everything anyway.
          git diff --name-only HEAD~1 HEAD > artifacts/ci/changed-paths.txt || true
          # Degenerate case (root commit, or a commit that changed nothing): the router rejects an
          # empty inventory, so fall back to any tracked path. `sed -n 1p` rather than `head -n 1`
          # deliberately — this step runs under `-o pipefail`, where `head` closing the pipe early
          # SIGPIPEs `git ls-files` and fails the whole step with 141.
          if [[ ! -s artifacts/ci/changed-paths.txt ]]; then
            git ls-files -- '*.md' | sed -n '1p' > artifacts/ci/changed-paths.txt
          fi
          test -s artifacts/ci/changed-paths.txt
          ./scripts/qualify-pr.sh route artifacts/ci/changed-paths.txt
      - name: Run every integrity subject unconditionally
        env:
          SIR_CI_INTEGRITY_SWEEP: "true"
        run: ./scripts/run-ci-gate.sh integrity artifacts/ci/results/integrity.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-integrity-sweep
          retention-days: 30
          path: artifacts/ci/results

  spatial-mutations:
    if: needs.route.outputs.spatial == 'true'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/run-ci-gate.sh spatial-mutations artifacts/ci/results/spatial-mutations.json
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' spatial-mutations
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: gate-spatial-mutations, path: artifacts/ci/results, retention-days: 1 }

  cancellation-mutations:
    if: needs.route.outputs.cancellation == 'true'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0, cache: npm }
      - run: npm ci --ignore-scripts
      - run: dotnet tool restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/run-ci-gate.sh cancellation-mutations artifacts/ci/results/cancellation-mutations.json
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' cancellation-mutations
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: gate-cancellation-mutations, path: artifacts/ci/results, retention-days: 1 }

  prepare-native:
    if: needs.route.outputs.classification != 'evidence-only'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/qualify-pr.sh prepare-part native
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-part-native
          compression-level: 0
          retention-days: 1
          path: |
            artifacts/ci/parts/native.tar
            artifacts/ci/parts/native.tar.index.json
            artifacts/ci/parts/native.receipt.path
            artifacts/ci/parts/native.manifest.path
            artifacts/ci/parts/native.timing.json
            artifacts/ci/parts/receipts
            artifacts/ci/parts/manifests
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' prepare-native
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: gate-prepare-native, path: artifacts/ci/results, retention-days: 1 }

  prepare-fable:
    if: needs.route.outputs.classification == 'domain' || needs.route.outputs.classification == 'cross-cutting'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/qualify-pr.sh prepare-part fable
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-part-fable
          compression-level: 0
          retention-days: 1
          path: |
            artifacts/ci/parts/fable.tar
            artifacts/ci/parts/fable.tar.index.json
            artifacts/ci/parts/fable.receipt.path
            artifacts/ci/parts/fable.manifest.path
            artifacts/ci/parts/fable.timing.json
            artifacts/ci/parts/receipts
            artifacts/ci/parts/manifests
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' prepare-fable
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: gate-prepare-fable, path: artifacts/ci/results, retention-days: 1 }

  prepare-web:
    if: needs.route.outputs.classification == 'documentation' || needs.route.outputs.classification == 'browser' || needs.route.outputs.classification == 'performance' || needs.route.outputs.classification == 'cross-cutting'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0, cache: npm }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/qualify-pr.sh prepare-part web
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-part-web
          compression-level: 0
          retention-days: 1
          path: |
            artifacts/ci/parts/web.tar
            artifacts/ci/parts/web.tar.index.json
            artifacts/ci/parts/web.receipt.path
            artifacts/ci/parts/web.manifest.path
            artifacts/ci/parts/web.timing.json
            artifacts/ci/parts/receipts
            artifacts/ci/parts/manifests
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' prepare-web
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: gate-prepare-web, path: artifacts/ci/results, retention-days: 1 }

  prepare-docs:
    if: needs.route.outputs.documentation == 'true'
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - run: ./scripts/qualify-pr.sh prepare-part docs
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-part-docs
          compression-level: 0
          retention-days: 1
          path: |
            artifacts/ci/parts/docs.tar
            artifacts/ci/parts/docs.tar.index.json
            artifacts/ci/parts/docs.receipt.path
            artifacts/ci/parts/docs.manifest.path
            artifacts/ci/parts/docs.timing.json
            artifacts/ci/parts/receipts
            artifacts/ci/parts/manifests
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' prepare-docs
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: gate-prepare-docs, path: artifacts/ci/results, retention-days: 1 }

  domain-conformance:
    if: needs.route.outputs.rules == 'true' || needs.route.outputs.spatial == 'true' || needs.route.outputs.cancellation == 'true'
    needs: [route, prepare-native, prepare-fable, prepare-web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Capture runner start
        run: echo "SIR_CI_RUNNER_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}" }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 26.5.0 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: ci-route, path: artifacts/ci }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: prepared-part-native, path: artifacts/ci/parts }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: prepared-part-fable, path: artifacts/ci/parts }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: prepared-part-web, path: artifacts/ci/parts }
      - name: Extract verified domain inputs once
        run: ./scripts/qualify-pr.sh extract-parts native fable web
      - name: Run independently receipted domain gates concurrently
        shell: bash
        env:
          PLAYWRIGHT_EXECUTABLE_PATH: /usr/bin/chromium
          SIR_CI_CACHE_HIT: "false"
          SIR_CI_PREFLIGHT_REUSED: "true"
        run: |
          status=0
          gates=()
          [[ '${{ needs.route.outputs.rules }}' == 'true' ]] && gates+=(rules)
          [[ '${{ needs.route.outputs.spatial }}' == 'true' ]] && gates+=(spatial)
          [[ '${{ needs.route.outputs.cancellation }}' == 'true' ]] && gates+=(cancellation)
          pids=()
          for gate in "${gates[@]}"; do
            ./scripts/run-ci-gate.sh "$gate" "artifacts/ci/results/$gate.json" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          if [[ '${{ needs.route.outputs.browser }}' == 'true' ]]; then
            ./scripts/run-ci-gate.sh browser-delivery artifacts/ci/results/browser-delivery.json || status=1
          fi
          exit "$status"
      - if: always()
        name: Record produced gate results
        shell: bash
        run: |
          mkdir -p artifacts/ci/results
          node -e 'const fs=require("node:fs");const d="artifacts/ci/results";const job=process.argv[1];const produced=fs.readdirSync(d).filter((n)=>!/^collected-.+\.json$/.test(n)&&fs.statSync(`${d}/${n}`).isFile()).sort();fs.writeFileSync(`${d}/collected-${job}.json`,`${JSON.stringify({job,produced})}\n`)' domain-conformance
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-domain-conformance
          path: artifacts/ci/results
          if-no-files-found: ignore
          retention-days: 1

  cross-runtime:
    if: needs.route.outputs.cross_runtime == 'true'
