schemaVersion: 1
commands:
  - id: dotnet-build
    command: "dotnet build SIR.slnx --locked-mode"
    timeout: 600
    environment: local-or-ci
  - id: dotnet-test
    command: "./scripts/test-conformance.sh"
    timeout: 900
    environment: ci
  - id: build-evidence
    command: "./scripts/test-conformance.sh"
    timeout: 600
    environment: local-or-ci
  - id: rules-governance
    command: "./scripts/generate-rules-governance.sh --check"
    timeout: 300
    environment: local-or-ci
environmentClasses:
  - local
  - ci
externalTools:
  - tool: dotnet
    minVersion: "10.0.0"
