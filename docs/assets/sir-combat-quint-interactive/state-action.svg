<svg xmlns="http://www.w3.org/2000/svg" id="effects-off" viewBox="0 0 720 240" role="img" aria-labelledby="state-title state-desc" data-diagram="state-action" data-effects="progressive" font-family="system-ui" font-size="14" style="background:#10161d">
  <title id="state-title">CombatState changes only through guarded atomic actions</title>
  <desc id="state-desc">The authoritative initialCombat record and representative AttackInput enter resolveConsequences. A valid-attack guard permits one atomic transition to a complete post-state plus a separate Observation; invalid input disables the action, so there is no transition.</desc>
  <defs><filter id="state-shadow"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#53b7ff" flood-opacity=".55"/></filter></defs>
  <style>svg{background:#10161d;font:14px system-ui}.box{fill:#28343d;stroke:#71808b;stroke-width:3}.action{fill:#183b50;stroke:#53b7ff;stroke-width:3}.label{fill:#f7f9fa}.edge{stroke:#53b7ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.motion{stroke-dasharray:8 6;animation:flow 2s linear infinite}.fx{filter:url(#state-shadow)}[data-effects="off"] .fx,svg:target .fx{filter:none}@keyframes flow{to{stroke-dashoffset:-28}}@media(prefers-reduced-motion:reduce){.motion{animation:none}}@media print{svg{background:#fff!important}.backdrop,.box,.action{fill:#fff;stroke:#000}.label{fill:#000}.edge{stroke:#000}.motion{animation:none}.fx{filter:none}}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path data-tooltip="pre-to-action" d="M0 0 L10 5 L0 10 Z" fill="#53b7ff"/></marker></defs>
  <rect class="backdrop" aria-hidden="true" x="0" y="0" width="720" height="240" fill="#10161d"/>
  <g data-tooltip="pre-state" aria-label="Authoritative initialCombat pre-state"><title>initialCombat has health 100, suppression 0, intact blocking cover, and an active unit.</title><rect class="box" x="14" y="20" width="205" height="190" rx="10" fill="#28343d" stroke="#71808b" stroke-width="3"/><text class="label" x="28" y="45" font-size="11" fill="#f7f9fa">CombatState · initialCombat</text><text class="label" x="28" y="70" fill="#f7f9fa">health = 100</text><text class="label" x="28" y="92" fill="#f7f9fa">suppression = 0</text><text class="label" x="28" y="114" fill="#f7f9fa">coverIntegrity = 100</text><text class="label" x="28" y="136" fill="#f7f9fa">coverBlocking = true</text><text class="label" x="28" y="158" fill="#f7f9fa">incapacitated = false</text></g>
  <g data-tooltip="guarded-action" aria-label="Guarded action"><title>validAttack enables one atomic resolveConsequences transition.</title><rect class="action fx" x="270" y="58" width="180" height="100" rx="50" fill="#183b50" stroke="#53b7ff" stroke-width="3"/><text class="label" x="302" y="93" font-size="11" fill="#f7f9fa">resolveConsequences</text><text class="label" x="312" y="122" font-size="11" fill="#f7f9fa">validAttack guard</text><text class="label" x="324" y="143" fill="#f7f9fa">atomic step</text></g>
  <g data-tooltip="post-state" aria-label="Complete post-state and separate Observation"><title>The successor has health 80 and suppression 12; its observation reports damage 20 and NoWound.</title><rect class="box" x="500" y="20" width="210" height="190" rx="10" fill="#28343d" stroke="#71808b" stroke-width="3"/><text class="label" x="512" y="43" font-size="12" fill="#f7f9fa">CombatState′</text><text class="label" x="512" y="63" font-size="10" fill="#f7f9fa">health = 80 · suppression = 12</text><text class="label" x="512" y="83" font-size="11" fill="#f7f9fa">coverIntegrity = 100</text><text class="label" x="512" y="103" font-size="11" fill="#f7f9fa">coverBlocking = true</text><text class="label" x="512" y="123" font-size="11" fill="#f7f9fa">incapacitated = false</text><text class="label" x="512" y="153" font-size="12" fill="#f7f9fa" data-tooltip="observation-channel"><title>Observation explains the completed action but is not durable CombatState.</title>Observation</text><text class="label" x="512" y="174" font-size="10" fill="#f7f9fa">damage = 20 · wound = NoWound</text></g>
  <path class="edge motion" data-semantic-edge="pre-state-to-action" data-directed-edge="true" d="M219 108 H270" fill="none" stroke="#53b7ff" stroke-width="3" marker-end="url(#arrow)"><title>CombatState and immutable AttackInput enter the guarded action together.</title></path><path data-tooltip="action-to-post" class="edge motion" data-semantic-edge="action-to-post-state" data-directed-edge="true" d="M450 108 H500" fill="none" stroke="#53b7ff" stroke-width="3" marker-end="url(#arrow)"><title>One enabled action yields the complete successor and observation without partial updates.</title></path>
  <text class="label" x="280" y="45" font-size="11" fill="#f7f9fa" data-tooltip="attack-input"><title>Immutable attempted-attack data consumed by the guard and action.</title>AttackInput</text><text class="label" x="258" y="228" fill="#f7f9fa" data-tooltip="disabled-action"><title>A false guard produces no successor and no hidden partial state.</title>invalid input → action disabled; no transition</text>
</svg>
