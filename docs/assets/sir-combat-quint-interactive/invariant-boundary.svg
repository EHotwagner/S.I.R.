<svg xmlns="http://www.w3.org/2000/svg" id="effects-off" viewBox="0 0 720 250" role="img" aria-labelledby="invariant-title invariant-desc" data-diagram="invariant-boundary" data-effects="progressive" font-family="system-ui" font-size="14" style="background:#10161d">
  <title id="invariant-title">An invariant encloses every reachable bounded combat state</title>
  <desc id="invariant-desc">A blue safe region contains reachable states whose health, suppression, and cover remain within zero and one hundred and whose incapacity matches zero health. A red mutated transition escapes to health minus one and becomes a counterexample.</desc>
  <defs><filter id="boundary-glow"><feGaussianBlur stdDeviation="4"/></filter><marker id="boundary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path data-tooltip="escape-edge" d="M0 0 L10 5 L0 10 Z" fill="#ff6b6b"/></marker></defs>
  <style>svg{background:#10161d;font:14px system-ui}.region{fill:#183b50;stroke:#53b7ff;stroke-width:4}.state{fill:#28343d;stroke:#f7f9fa;stroke-width:2}.bad{fill:#4b2025;stroke:#ff6b6b;stroke-width:4}.label{fill:#f7f9fa}.escape{stroke:#ff6b6b;stroke-width:4;fill:none;marker-end:url(#boundary-arrow)}.motion{stroke-dasharray:10 7;animation:escape 2s linear infinite}.fx{filter:url(#boundary-glow)}[data-effects="off"] .fx,svg:target .fx{filter:none}@keyframes escape{to{stroke-dashoffset:-34}}@media(prefers-reduced-motion:reduce){.motion{animation:none}}@media print{svg{background:#fff!important}.backdrop,.region,.state,.bad{fill:#fff;stroke:#000}.label{fill:#000}.escape{stroke:#000}.motion{animation:none}.fx{filter:none}}</style>
  <rect class="backdrop" aria-hidden="true" x="0" y="0" width="720" height="250" fill="#10161d"/>
  <g data-tooltip="safe-region" aria-label="Safe invariant region"><title>Every checked reachable state inside this region satisfies bounded state and health-incapacity agreement.</title><rect class="region" x="32" y="28" width="478" height="194" rx="68" fill="#183b50" stroke="#53b7ff" stroke-width="4"/><text class="label" x="68" y="62" fill="#f7f9fa">boundedCombatState ∧ incapacityMatchesHealth</text><circle data-tooltip="healthy-state" class="state" cx="130" cy="132" r="34" fill="#28343d" stroke="#f7f9fa" stroke-width="2"><title>Health 100 and active: a reachable safe state.</title></circle><text class="label" x="105" y="129" fill="#f7f9fa">100 HP</text><text class="label" x="111" y="149" fill="#f7f9fa">active</text><circle data-tooltip="wounded-state" class="state" cx="280" cy="132" r="34" fill="#28343d" stroke="#f7f9fa" stroke-width="2"><title>Health 20 with a wound: reachable and within bounds.</title></circle><text class="label" x="263" y="129" fill="#f7f9fa">20 HP</text><text class="label" x="261" y="149" fill="#f7f9fa">wound</text><circle data-tooltip="incapacitated-state" class="state" cx="430" cy="132" r="40" fill="#28343d" stroke="#f7f9fa" stroke-width="2"><title>Health 0 and incapacitated: the fields agree.</title></circle><text class="label" x="418" y="127" fill="#f7f9fa">0 HP</text><text class="label" x="403" y="147" font-size="8" fill="#f7f9fa">incapacitated</text></g>
  <g data-tooltip="mutated-result" aria-label="Mutated counterexample outside invariant"><title>This mutated successor has health minus one and lies outside the invariant.</title><circle data-tooltip="negative-health" class="bad fx" cx="640" cy="132" r="48" fill="#4b2025" stroke="#ff6b6b" stroke-width="4"><title>Health minus one: the earliest state violating the bound.</title></circle><text class="label" x="622" y="127" fill="#f7f9fa">−1 HP</text><text class="label" x="613" y="147" font-size="8" fill="#f7f9fa">counterexample</text></g>
  <path class="escape motion" data-semantic-edge="mutated-boundary-escape" data-directed-edge="true" d="M464 132 H592" fill="none" stroke="#ff6b6b" stroke-width="4" marker-end="url(#boundary-arrow)"><title>The weakened lower bound permits a transition from zero health to minus one.</title></path><text class="label" x="505" y="92" font-size="11" fill="#f7f9fa" data-tooltip="mutated-bound-label"><title>The mutation weakens only the health bound so the detector has one precise defect to find.</title>mutated bound</text>
  <text class="label" x="72" y="241" font-size="10" fill="#f7f9fa" data-tooltip="property-scope"><title>This figure explains a property over reachable states and adds no model machinery.</title>The property quantifies over reachable model states; the diagram does not add a new state or rule.</text>
</svg>
