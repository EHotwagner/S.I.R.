  </g>

  <g id="right-sidebar" data-name="04 · Right sidebar — Selection inspector">
    <rect x="1202" y="164" width="224" height="564" rx="6" fill="#111a17" stroke="#43584e"/>
    <text x="1208" y="182" class="mono label">Selection inspector</text>
    <g id="inspector-panel-actions" data-name="Inspector panel actions">
      <rect x="1208" y="189" width="26" height="44" rx="5" class="button"/>
      <text x="1221" y="211" class="mono small" text-anchor="middle">Coll</text>
      <rect x="1237" y="189" width="43" height="44" rx="5" class="button"/>
      <text x="1258.5" y="211" class="mono button-label">↑</text>
      <rect x="1283" y="189" width="43" height="44" rx="5" class="button"/>
      <text x="1304.5" y="211" class="mono button-label">↓</text>
      <rect x="1329" y="189" width="43" height="44" rx="5" class="button"/>
      <text x="1350.5" y="211" class="mono button-label">←</text>
      <rect x="1375" y="189" width="44" height="44" rx="5" class="button"/>
      <text x="1397" y="211" class="mono button-label">×</text>
    </g>

    <rect x="1202" y="239" width="224" height="489" rx="9" fill="#151f1c" stroke="#43584e"/>
    <text x="1220" y="288" class="mono body focus" letter-spacing="3">UNIT</text>
    <text x="1220" y="334" class="mono" font-size="24" font-weight="700">Selected unit</text>
    <text x="1220" y="380" class="mono" font-size="18">Unit 1 ·</text>
    <text x="1220" y="403" class="mono" font-size="18">rifleman</text>

    <g id="inspector-fields" data-name="Inspector form fields">
      <text x="1220" y="444" class="mono body">Side</text>
      <rect x="1384" y="417" width="26" height="42" rx="6" fill="#101715" stroke="#60776b"/>
      <text x="1397" y="439" class="mono body" text-anchor="middle">⌄</text>
      <text x="1220" y="489" class="mono body">Class ID</text>
      <rect x="1384" y="465" width="26" height="39" rx="6" fill="#101715" stroke="#60776b"/>
      <text x="1220" y="535" class="mono body">Square size</text>
      <rect x="1384" y="510" width="26" height="39" rx="6" fill="#101715" stroke="#60776b"/>
      <text x="1220" y="580" class="mono body">Current HP</text>
      <rect x="1384" y="556" width="26" height="39" rx="6" fill="#101715" stroke="#60776b"/>
      <text x="1220" y="625" class="mono body">Maximum HP</text>
      <rect x="1384" y="601" width="26" height="39" rx="6" fill="#101715" stroke="#60776b"/>
      <text x="1220" y="671" class="mono body">Controller</text>
      <rect x="1384" y="646" width="26" height="41" rx="6" fill="#101715" stroke="#60776b"/>
      <text x="1397" y="667" class="mono body" text-anchor="middle">⌄</text>
      <text x="1220" y="717" class="mono body">Direction script</text>
      <rect x="1384" y="693" width="26" height="35" rx="6" fill="#101715" stroke="#60776b"/>
    </g>
  </g>

  <g id="timeline" data-name="05 · Unified tactical timeline">
    <rect x="14" y="734" width="1412" height="152" rx="6" fill="#151f1c" stroke="#43584e"/>
    <rect x="14" y="734" width="1412" height="6" fill="#26372f" stroke="#60776b"/>

    <g id="timeline-legend" data-name="Timeline channel legend">
      <rect x="15" y="741" width="5" height="18" fill="#53b7ff"/>
      <text x="27" y="754" class="mono small intent" font-weight="700">Authored</text>
      <rect x="95" y="741" width="5" height="18" fill="#e5b8ff"/>
      <text x="107" y="754" class="mono small predicted" font-weight="700">Predicted</text>
      <rect x="184" y="741" width="5" height="18" fill="#8ce99a"/>
      <text x="196" y="754" class="mono small accepted" font-weight="700">Accepted</text>
      <rect x="264" y="741" width="5" height="18" fill="#ffd166"/>
      <text x="276" y="754" class="mono small focus" font-weight="700">Committed</text>
      <text x="1420" y="754" class="mono small focus" font-weight="700" text-anchor="end">Current time 0 · next editable 0</text>
    </g>

    <g id="timeline-transport" data-name="Timeline transport">
      <rect x="15" y="759" width="65" height="44" rx="6" class="button"/>
      <text x="47.5" y="781" class="mono button-label">Play</text>
      <rect x="86" y="759" width="63" height="44" rx="6" class="button" opacity=".55"/>
      <text x="117.5" y="781" class="mono button-label muted">Home</text>
      <rect x="155" y="759" width="44" height="44" rx="6" class="button" opacity=".55"/>
      <text x="177" y="781" class="mono button-label muted">−1</text>
      <rect x="205" y="759" width="44" height="44" rx="6" class="button"/>
      <text x="227" y="781" class="mono button-label">+1</text>
      <rect x="256" y="759" width="55" height="44" rx="6" class="button"/>
      <text x="283.5" y="781" class="mono button-label">End</text>
      <rect x="317" y="759" width="190" height="44" rx="6" class="button" opacity=".55"/>
      <text x="412" y="781" class="mono button-label muted">Move command here</text>
      <rect x="513" y="759" width="158" height="44" rx="6" class="button" opacity=".55"/>
      <text x="592" y="781" class="mono button-label muted">Remove command</text>
      <text x="678" y="790" class="mono body">Time</text>
    </g>

    <g id="time-ruler" data-name="Time ruler">
      <rect x="15" y="825" width="1410" height="8" rx="4" fill="#5b5b58" stroke="#8d9691"/>
      <circle cx="24" cy="829" r="8" fill="#ffd166"/>
    </g>

    <g id="committed-lane" data-name="Committed timeline lane">
      <rect x="15" y="850" width="1410" height="35" fill="#151f1c"/>
      <rect x="15" y="850" width="5" height="35" fill="#ffd166"/>
      <text x="27" y="874" class="mono body focus" font-weight="700">Committed</text>
      <text x="123" y="874" class="mono body focus">Committed simulator execution · 0–0</text>
    </g>
  </g>
</svg>
