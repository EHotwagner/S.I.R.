<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="sym-title sym-desc" data-diagram="canonical-symmetry" data-effects="css-filter">
  <title id="sym-title">Canonical ordering makes point-to-point visibility symmetric</title>
  <desc id="sym-desc">Requests A to B and B to A enter from opposite sides, pass through a canonical minimum and maximum cell gate, and evaluate the same ordered supercover cells.</desc>
  <defs><filter id="sym-glow"><feGaussianBlur stdDeviation="6" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="sym-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#53b7ff"/></marker><style>.flow{stroke-dasharray:8 10;animation:symFlow 1.5s linear infinite}.gate{animation:symGate 2.6s ease-in-out infinite}@keyframes symFlow{to{stroke-dashoffset:-36}}@keyframes symGate{50%{filter:url(#sym-glow);stroke:#ffd166}}svg:target .fx{display:none}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media print{.fx{display:none}}</style></defs>
  <rect width="960" height="430" rx="24" fill="#10161d"/><text x="50" y="52" fill="#f7f9fa" font-family="system-ui,sans-serif" font-size="24" font-weight="700">SYMMETRY / one canonical question</text>
  <g font-family="system-ui,sans-serif"><rect x="55" y="105" width="190" height="80" rx="16" fill="#28343d" stroke="#53b7ff" stroke-width="3"/><text x="150" y="139" fill="#f7f9fa" text-anchor="middle" font-size="21">request A → B</text><text x="150" y="166" fill="#aeb9c2" text-anchor="middle">caller order</text>
  <rect x="55" y="250" width="190" height="80" rx="16" fill="#28343d" stroke="#ffd166" stroke-width="3"/><text x="150" y="284" fill="#f7f9fa" text-anchor="middle" font-size="21">request B → A</text><text x="150" y="311" fill="#aeb9c2" text-anchor="middle">caller order</text>
  <path d="M245 145C330 145 315 197 390 197M245 290C330 290 315 223 390 223" fill="none" stroke="#53b7ff" stroke-width="4" marker-end="url(#sym-arr)" class="flow fx"/>
  <rect class="gate" x="390" y="155" width="180" height="110" rx="20" fill="#17232c" stroke="#53b7ff" stroke-width="4"/><text x="480" y="190" fill="#f7f9fa" text-anchor="middle" font-size="20" font-weight="700">canonicalPair</text><text x="480" y="220" fill="#53b7ff" text-anchor="middle" font-family="ui-monospace,monospace">lo = min(A,B)</text><text x="480" y="246" fill="#ffd166" text-anchor="middle" font-family="ui-monospace,monospace">hi = max(A,B)</text>
  <path d="M570 210H660" stroke="#53b7ff" stroke-width="4" marker-end="url(#sym-arr)" class="flow fx"/>
  <rect x="660" y="120" width="245" height="180" rx="20" fill="#17232c" stroke="#71808b" stroke-width="3"/><text x="782" y="154" fill="#f7f9fa" text-anchor="middle" font-size="19">same ordered cells</text><g transform="translate(690 177)"><rect width="48" height="48" fill="#53b7ff"/><rect x="52" width="48" height="48" fill="#164c6d"/><rect x="104" width="48" height="48" fill="#164c6d"/><rect x="156" width="48" height="48" fill="#ffd166"/><path d="M24 24H180" stroke="#f7f9fa" stroke-width="3" stroke-dasharray="5 5"/></g><text x="782" y="265" fill="#aeb9c2" text-anchor="middle" font-size="17">LOS(A,B) = LOS(B,A)</text></g>
  <text x="50" y="385" fill="#aeb9c2" font-family="system-ui,sans-serif" font-size="17">Canonicalization happens before the tie-break, so direction cannot select a different blocker set.</text><g id="effects-off" transform="translate(0 430)"/>
</svg>
