<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="work-title work-desc" data-diagram="work-bound" data-effects="css-filter">
  <title id="work-title">Declared work is bounded before visibility evaluation</title><desc id="work-desc">A four-pair matrix enters a guard. Declared sampled-line work of twelve exceeds a maximum of eight, so the result is truncated with zero evaluated visible samples. A separate meter shows internal supercover work of sixteen as diagnostic rather than the public bound.</desc>
  <defs><filter id="wk-glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.meter{animation:wkMeter 2.8s ease-in-out infinite}.reject{animation:wkReject 1.8s ease-in-out infinite}@keyframes wkMeter{50%{opacity:.45}}@keyframes wkReject{50%{filter:url(#wk-glow)}}svg:target .fx{display:none}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media print{.fx{display:none}}</style></defs>
  <rect width="960" height="470" rx="24" fill="#10161d"/><text x="48" y="50" fill="#f7f9fa" font-family="system-ui,sans-serif" font-size="24" font-weight="700">BOUNDS / refuse work before tracing</text>
  <g font-family="system-ui,sans-serif"><text data-tooltip="pair-matrix" x="60" y="98" fill="#aeb9c2" font-size="18"><title>Pair matrix: two source footprint cells times two target footprint cells yields four candidate visibility samples.</title>pair matrix</text><g transform="translate(60 120)"><rect data-tooltip="pair-o0-t0" width="82" height="72" fill="#164c6d" stroke="#53b7ff" stroke-width="2"><title>Pair o₀t₀ contributes declaredPairWork = max(|dx|, |dy|) + 1 before any line cells are materialized.</title></rect><rect data-tooltip="pair-o0-t1" x="82" width="82" height="72" fill="#28343d" stroke="#71808b" stroke-width="2"><title>Pair o₀t₁ is counted in both the pair cardinality guard and the sum of declared sampled-line work.</title></rect><rect data-tooltip="pair-o1-t0" y="72" width="82" height="72" fill="#28343d" stroke="#71808b" stroke-width="2"><title>Pair o₁t₀ remains unevaluated when the total declared work guard rejects the query.</title></rect><rect data-tooltip="pair-o1-t1" x="82" y="72" width="82" height="72" fill="#164c6d" stroke="#53b7ff" stroke-width="2"><title>Pair o₁t₁ completes the four-pair Cartesian product; pair count alone still fits the maximum of eight.</title></rect><g fill="#f7f9fa" font-family="ui-monospace,monospace" font-size="18" text-anchor="middle"><text x="41" y="43">o₀t₀</text><text x="123" y="43">o₀t₁</text><text x="41" y="115">o₁t₀</text><text x="123" y="115">o₁t₁</text></g></g>
  <path d="M244 192H325" stroke="#71808b" stroke-width="5"/><rect data-tooltip="work-guard" x="325" y="105" width="245" height="175" rx="20" fill="#17232c" stroke="#ffd166" stroke-width="3"><title>Pre-materialization guard: pair count 4 is allowed, but declaredTraceWork 12 exceeds maximumCrossedItems 8, so evaluation is truncated.</title></rect><text x="447" y="142" fill="#ffd166" text-anchor="middle" font-size="19" font-weight="700">pre-materialization guard</text><text data-tooltip="pair-limit" x="350" y="180" fill="#f7f9fa" font-family="ui-monospace,monospace"><title>First admission test passes: four footprint pairs do not exceed the maximum of eight.</title>pairs = 4 ≤ 8</text><text data-tooltip="declared-limit" x="350" y="214" fill="#ff6b6b" font-family="ui-monospace,monospace"><title>Second admission test fails: twelve declared crossed items exceed the maximum of eight.</title>declared = 12 &gt; 8</text><text x="350" y="250" fill="#aeb9c2">stop before visibility</text>
  <path d="M570 192H650" stroke="#ff6b6b" stroke-width="5"/><g class="reject fx"><path d="M610 167l25 25-25 25-25-25z" fill="#ff6b6b"/></g><rect data-tooltip="truncated-result" x="650" y="105" width="250" height="175" rx="20" fill="#321d23" stroke="#ff6b6b" stroke-width="4"><title>Truncated result: visible is false and visibleSamples is zero because no footprint pair is evaluated after admission fails.</title></rect><text x="775" y="145" fill="#f7f9fa" text-anchor="middle" font-size="22" font-weight="700">TRUNCATED</text><text x="775" y="190" fill="#aeb9c2" text-anchor="middle">visible = false</text><text x="775" y="225" fill="#aeb9c2" text-anchor="middle">visibleSamples = 0</text><text x="775" y="260" fill="#aeb9c2" text-anchor="middle">no pair evaluated</text>
  <text x="60" y="340" fill="#f7f9fa" font-size="18">Two quantities, two meanings</text><rect x="60" y="365" width="420" height="24" rx="12" fill="#28343d"/><rect data-tooltip="declared-work" class="meter" x="60" y="365" width="315" height="24" rx="12" fill="#ffd166"><title>Declared work = 12: the public admission quantity derived from max-axis sampled-line lengths.</title></rect><text x="495" y="383" fill="#ffd166">declared sampled work = 12</text><rect x="60" y="406" width="420" height="24" rx="12" fill="#28343d"/><rect data-tooltip="supercover-work" class="meter" x="60" y="406" width="420" height="24" rx="12" fill="#53b7ff"><title>Diagnostic supercover work = 16: the sum of |dx| + |dy| + 1 cell counts, reported separately and not used as the public bound.</title></rect><text x="495" y="424" fill="#53b7ff">diagnostic supercover work = 16</text></g><g id="effects-off" transform="translate(0 470)"/>
</svg>
