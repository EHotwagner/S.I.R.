<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="block-title block-desc" data-diagram="blocker-semantics" data-effects="css-filter">
  <title id="block-title">Endpoint exemption and interior blockers</title><desc id="block-desc">Three parallel grid rays compare an opaque observer endpoint that remains visible, an opaque interior terrain cell that blocks, and an opaque canonical edge that blocks.</desc>
  <defs><filter id="bl-glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.ray{stroke-dasharray:9 9;animation:blRay 1.6s linear infinite}.stop{animation:blStop 2s ease-in-out infinite}@keyframes blRay{to{stroke-dashoffset:-36}}@keyframes blStop{50%{filter:url(#bl-glow);transform:scale(1.12)}}svg:target .fx{display:none}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media print{.fx{display:none}}</style></defs>
  <rect width="960" height="450" rx="24" fill="#10161d"/><text x="48" y="49" fill="#f7f9fa" font-family="system-ui,sans-serif" font-size="24" font-weight="700">BLOCKERS / where opacity counts</text>
  <g font-family="system-ui,sans-serif" font-size="17"><text x="48" y="118" fill="#f7f9fa">opaque endpoint</text><text x="48" y="230" fill="#f7f9fa">opaque interior</text><text x="48" y="342" fill="#f7f9fa">opaque boundary</text>
  <g transform="translate(270 75)"><g stroke="#71808b" stroke-width="2"><g fill="#28343d"><rect width="120" height="80"/><rect x="120" width="120" height="80"/><rect x="240" width="120" height="80"/><rect x="360" width="120" height="80"/></g><g transform="translate(0 112)" fill="#28343d"><rect width="120" height="80"/><rect x="120" width="120" height="80"/><rect x="240" width="120" height="80"/><rect x="360" width="120" height="80"/></g><g transform="translate(0 224)" fill="#28343d"><rect width="120" height="80"/><rect x="120" width="120" height="80"/><rect x="240" width="120" height="80"/><rect x="360" width="120" height="80"/></g></g>
  <rect x="7" y="7" width="106" height="66" fill="#ff6b6b" opacity=".62"/><rect x="127" y="119" width="106" height="66" fill="#ff6b6b" opacity=".75"/><line x1="240" y1="231" x2="240" y2="297" stroke="#ff6b6b" stroke-width="10"/>
  <g fill="none" stroke="#53b7ff" stroke-width="5" class="ray fx"><path d="M55 40H425"/><path d="M55 152H165"/><path d="M55 264H235"/></g>
  <g fill="#53b7ff"><circle cx="55" cy="40" r="15"/><circle cx="55" cy="152" r="15"/><circle cx="55" cy="264" r="15"/></g><g fill="#ffd166"><path d="M425 22l18 18-18 18-18-18z"/><path d="M425 134l18 18-18 18-18-18z"/><path d="M425 246l18 18-18 18-18-18z"/></g>
  <text x="510" y="47" fill="#7ee787">VISIBLE</text><text x="510" y="159" fill="#ff6b6b">BLOCKED</text><text x="510" y="271" fill="#ff6b6b">BLOCKED</text><g class="stop fx" fill="#ff6b6b"><path d="M180 136l15 16-15 16-15-16z"/><path d="M240 248l15 16-15 16-15-16z"/></g></g></g>
  <text x="48" y="412" fill="#aeb9c2" font-family="system-ui,sans-serif" font-size="17">The origin and target establish the question; only intermediate terrain and sampled orthogonal boundaries obstruct it.</text><g id="effects-off" transform="translate(0 450)"/>
</svg>
