<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="fp-title fp-desc" data-diagram="footprint-exposure" data-effects="css-filter">
  <title id="fp-title">Footprint pair aggregation uses existential visibility</title><desc id="fp-desc">Two two-cell footprints create four source-target sample pairs. Three red dashed paths are blocked and one blue path survives, so visible samples equals one of four and the aggregate result is visible.</desc>
  <defs><filter id="fp-glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.live{stroke-dasharray:10 10;animation:fpLive 1.4s linear infinite}.answer{animation:fpAnswer 2.4s ease-in-out infinite}@keyframes fpLive{to{stroke-dashoffset:-40}}@keyframes fpAnswer{50%{filter:url(#fp-glow);opacity:.65}}svg:target .fx{display:none}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media print{.fx{display:none}}</style></defs>
  <rect width="960" height="480" rx="24" fill="#10161d"/><text x="48" y="50" fill="#f7f9fa" font-family="system-ui,sans-serif" font-size="24" font-weight="700">FOOTPRINTS / any visible pair exposes the target</text>
  <g transform="translate(80 105)" font-family="system-ui,sans-serif"><text x="55" y="-18" fill="#53b7ff" font-size="18" text-anchor="middle">origin cells</text><text x="565" y="-18" fill="#ffd166" font-size="18" text-anchor="middle">target cells</text>
  <g stroke="#71808b" stroke-width="3"><rect width="110" height="110" fill="#164c6d"/><rect y="110" width="110" height="110" fill="#164c6d"/><rect x="510" width="110" height="110" fill="#594d20"/><rect x="510" y="110" width="110" height="110" fill="#594d20"/></g>
  <g fill="#53b7ff"><circle cx="55" cy="55" r="18"/><circle cx="55" cy="165" r="18"/></g><g fill="#ffd166"><path d="M565 35l20 20-20 20-20-20z"/><path d="M565 145l20 20-20 20-20-20z"/></g>
  <g fill="none" stroke="#ff6b6b" stroke-width="4" stroke-dasharray="7 8" opacity=".7"><path d="M75 55L545 55"/><path d="M75 55L545 165"/><path d="M75 165L545 165"/></g><path d="M75 165L545 55" fill="none" stroke="#53b7ff" stroke-width="7" class="live fx"/>
  <g fill="#ff6b6b"><path d="M295 43l12 12-12 12-12-12z"/><path d="M335 98l12 12-12 12-12-12z"/><path d="M295 153l12 12-12 12-12-12z"/></g>
  <path d="M665 110H735" stroke="#71808b" stroke-width="4"/><rect class="answer" x="735" y="55" width="145" height="115" rx="18" fill="#123a50" stroke="#53b7ff" stroke-width="4"/><text x="807" y="88" fill="#aeb9c2" text-anchor="middle">visibleSamples</text><text x="807" y="127" fill="#f7f9fa" text-anchor="middle" font-size="30" font-weight="700">1 / 4</text><text x="807" y="154" fill="#7ee787" text-anchor="middle" font-size="19">VISIBLE</text>
  <text x="0" y="275" fill="#aeb9c2" font-size="17">Cartesian product: 2 origins × 2 targets = 4 samples</text><text x="0" y="310" fill="#f7f9fa" font-size="18">aggregate = visibleSamples &gt; 0</text></g>
  <text x="48" y="443" fill="#aeb9c2" font-family="system-ui,sans-serif" font-size="17">This is exposure, not unanimity: one unobstructed footprint pair is sufficient.</text><g id="effects-off" transform="translate(0 480)"/>
</svg>
