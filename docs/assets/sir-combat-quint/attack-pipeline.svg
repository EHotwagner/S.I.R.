<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="attack-title attack-desc" data-diagram="attack-pipeline" data-effects="progressive">
  <title id="attack-title">A rifle attack crosses trace, cover, armor, damage, and consequences</title>
  <desc id="attack-desc">A production rifleman glyph fires a blue traced shot through cover. The contact is retained by armor, becomes twenty damage, then updates wound, suppression, and collateral consequences atomically.</desc>
  <defs><filter id="attack-glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>:root{--canvas:#10161d;--terrain:#28343d;--grid:#71808b;--text:#f7f9fa;--human:#53b7ff;--arcane:#d792ff;--neutral:#ffd166;--health:#ff6b6b}svg{background:var(--canvas);font:14px system-ui}.label{fill:var(--text)}.edge{stroke:var(--grid);stroke-width:3;fill:none}.human{fill:var(--human);stroke:var(--human)}.neutral{fill:var(--neutral)}.health{fill:var(--health)}.consequence{fill:var(--terrain)}.motion{stroke-dasharray:12 8;animation:dash 1.8s linear infinite}.fx{filter:url(#attack-glow)}[data-effects="off"] .fx{filter:none}@keyframes dash{to{stroke-dashoffset:-40}}@media(prefers-reduced-motion:reduce){.motion{animation:none}}@media print{svg{background:#fff}.label{fill:#000}.consequence{fill:#fff}.motion{animation:none}.fx{filter:none}}</style>
  <g aria-label="Production rifleman glyph on a one-cell footprint" transform="translate(34 76) scale(3)"><rect x="0" y="0" width="24" height="24" rx="2" fill="none" stroke="#71808b"/><path class="human" d="M4 18 L12 4 L20 18 L16 18 L12 11 L8 18 Z"/><path d="M5 20 L19 8" fill="none" stroke="#53b7ff" stroke-width="2"/></g>
  <text class="label" x="28" y="178">rifleman / footprint</text>
  <g aria-label="Physical shot trace and first collision"><path class="edge motion fx" d="M112 112 H280" stroke="#53b7ff"/><circle class="neutral" cx="280" cy="112" r="7"/><text class="label" x="156" y="96">trace → contact</text></g>
  <g aria-label="Cover consumes this collision"><rect x="302" y="58" width="34" height="108" rx="4" fill="#28343d" stroke="#ffd166" stroke-width="4"/><path d="M302 62 L336 92 M302 94 L336 124 M302 126 L336 156" stroke="#71808b"/><text class="label" x="286" y="190">cover</text></g>
  <g aria-label="Armor retains eighty percent"><path d="M382 68 L428 84 V120 C428 148 406 164 382 174 C358 164 336 148 336 120 V84 Z" fill="none" stroke="#d792ff" stroke-width="4"/><text class="label" x="354" y="112">× 0.8</text><text class="label" x="352" y="190">armor</text></g>
  <g aria-label="Twenty damage and health consequence"><circle cx="500" cy="112" r="42" fill="none" stroke="#ff6b6b" stroke-width="7"/><text class="label" x="486" y="118">20</text><text class="label" x="466" y="190">damage</text></g>
  <g aria-label="Atomic wound suppression and collateral consequences"><path class="edge" d="M542 112 H608"/><path class="consequence" d="M608 78 L668 112 L608 146 Z" stroke="#ffd166" stroke-width="3"/><text class="label" x="615" y="108">W / S</text><text class="label" x="612" y="127">C</text><text class="label" x="638" y="190" text-anchor="middle" font-size="12">atomic consequences</text></g>
</svg>
