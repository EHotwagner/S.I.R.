<svg xmlns="http://www.w3.org/2000/svg" id="effects-off" viewBox="0 0 720 300" role="img" aria-labelledby="attack-title attack-desc" data-diagram="attack-pipeline" data-effects="progressive" font-family="system-ui" font-size="14" style="background:#10161d">
  <title id="attack-title">A rifle attack reaches contact, then separates a stopped cover impact from an unblocked damage path</title>
  <desc id="attack-desc">A production rifleman unit and authoritative trace reach first contact. A blocking-cover branch stops with zero target damage. A separate unblocked branch applies eighty-percent armor retention, twenty damage, then uses production health and status channels for atomic consequences. The depicted bindings are COMBAT-TRACE-002, COMBAT-COLLISION-001, COMBAT-COVER-003, COMBAT-ARMOR-004, COMBAT-DAMAGE-001, COMBAT-HEALTH-001, COMBAT-WOUND-001, COMBAT-SUPPRESSION-001, COMBAT-COLLATERAL-001, and COMBAT-ATTACK-RESOLUTION-001.</desc>
  <defs><filter id="attack-glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>svg{background:#10161d;font:14px system-ui}.motion{stroke-dasharray:12 7;animation:dash 1.8s linear infinite}.fx{filter:url(#attack-glow)}[data-effects="off"] .fx,svg:target .fx{filter:none}@keyframes dash{to{stroke-dashoffset:-38}}@media(prefers-reduced-motion:reduce){.motion{animation:none}}@media print{svg{background:#fff!important}.backdrop{fill:#fff}.label{fill:#000}.motion{animation:none}.fx{filter:none}}</style>
  <rect class="backdrop" aria-hidden="true" x="0" y="0" width="720" height="300" fill="#10161d"/>
  <g aria-label="Production four-by-four-cell persistent-renderer unit at one-half documentation scale" data-unit-glyph="rifleman"><rect data-overlay-id="unit.footprints" data-overlay-kind="footprint" data-overlay-pattern="directional-hatch" x="12" y="90" width="128" height="128" fill="none" color="#ffd166" stroke="currentColor" stroke-width="1" stroke-linecap="square" stroke-linejoin="bevel" vector-effect="non-scaling-stroke"/><rect x="14.5" y="92.5" width="123" height="123" rx="3" fill="#10161d" stroke="#53b7ff" stroke-width="1.5"/><g aria-label="Exact production rifleman glyph primitives" data-class-id="rifleman" transform="translate(76 154) scale(5) translate(-12 -12)"><path d="M4 18 L12 4 L20 18 L16 18 L12 11 L8 18 Z" fill="#f7f9fa"/><path d="M5 20 L19 8" fill="none" stroke="#f7f9fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="label" x="12" y="238" fill="#f7f9fa">rifleman · 4×4 · persistent renderer × 0.5</text></g>
  <g aria-label="Production trace and first-contact overlay primitives at one-half documentation scale" data-overlay-id="combat.attack-traces" data-overlay-pattern="directional-hatch" color="#ffd166"><polyline class="motion fx" data-semantic-edge="trace-to-first-contact" points="140,154 220,154" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="square" stroke-linejoin="bevel" vector-effect="non-scaling-stroke"/><circle data-impact="authoritative" cx="220" cy="154" r="2.5" fill="currentColor" vector-effect="non-scaling-stroke"/><text class="label" x="148" y="138" fill="#f7f9fa">trace → contact</text></g>
  <path data-semantic-edge="blocking-cover-branch" d="M220 149 C242 90 255 72 286 72" fill="none" stroke="#71808b" stroke-width="3"/>
  <g aria-label="Production direction-overlay primitive shows blocking cover at one-half documentation scale" data-overlay-id="cover.exposure" data-overlay-pattern="directional-hatch" color="#ffd166"><line data-direction-arc="" x1="286" y1="60" x2="286" y2="84" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="bevel" vector-effect="non-scaling-stroke"/><text class="label" x="302" y="69" fill="#f7f9fa">blocking cover</text><text class="label" x="302" y="91" fill="#f7f9fa">STOP · target damage 0</text></g>
  <path data-semantic-edge="unblocked-contact-branch" d="M225 154 H302" fill="none" stroke="#71808b" stroke-width="3"/>
  <g aria-label="Production direction-overlay primitive shows armor coverage at one-half documentation scale" data-overlay-id="combat.armor-coverage" data-overlay-pattern="directional-hatch" color="#ffd166"><line data-direction-arc="" x1="340" y1="140" x2="340" y2="164" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="bevel" vector-effect="non-scaling-stroke"/><text class="label" x="310" y="134" fill="#f7f9fa">armor × 0.8</text><text class="label" x="308" y="188" fill="#f7f9fa">unblocked path</text></g>
  <path data-semantic-edge="armor-to-atomic-consequence" d="M344 158 H470" fill="none" stroke="#71808b" stroke-width="3"/>
  <g aria-label="Production health and separate status overlays at one-half documentation scale plus faction-neutral consequence fields"><rect data-unit-health-density="compact" x="490" y="136" width="120" height="2.5" rx="0.5" fill="#59636b"/><rect data-unit-health-fill="80" x="490" y="136" width="96" height="2.5" rx="0.5" fill="#ff6b6b"/><circle data-overlay-id="combat.hp-wounds" data-overlay-pattern="directional-hatch" data-status-current="80" data-status-maximum="100" data-status-tokens="" cx="500" cy="162" r="3" fill="none" color="#ffd166" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/><circle data-overlay-id="combat.suppression" data-overlay-pattern="directional-hatch" data-status-current="" data-status-maximum="" data-status-tokens="suppression:12" cx="520" cy="162" r="3" fill="none" color="#ffd166" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/><text class="label" x="450" y="126" font-size="10" fill="#f7f9fa">20 damage · HP 80/100 · NoWound</text><text class="label" x="450" y="190" font-size="10" fill="#f7f9fa">attacker → non-allied target · neutral overlays</text></g>
</svg>
