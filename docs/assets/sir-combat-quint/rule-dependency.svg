<svg xmlns="http://www.w3.org/2000/svg" id="effects-off" viewBox="0 0 720 360" role="img" aria-labelledby="dependency-title dependency-desc" data-diagram="rule-dependency" data-effects="progressive" font-family="system-ui" font-size="13" style="background:#10161d">
  <title id="dependency-title">Eight direct rule dependencies converge on aggregate attack resolution</title>
  <desc id="dependency-desc">Engagement, collision, cover, penetration, damage, wound, suppression, and collateral each point directly to COMBAT-ATTACK-RESOLUTION-001. The arrows show registry dependencies, not execution or explanation order.</desc>
  <defs><filter id="dependency-glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="dep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#71808b"/></marker></defs>
  <style>svg{background:#10161d;font:13px system-ui}.node{fill:#28343d;stroke:#53b7ff;stroke-width:2}.aggregate{fill:#3a2447;stroke:#d792ff;stroke-width:3}.label{fill:#f7f9fa}.edge{stroke:#71808b;stroke-width:2;fill:none;marker-end:url(#dep-arrow)}.motion{animation:pulse 2.4s ease-in-out infinite}.fx{filter:url(#dependency-glow)}[data-effects="off"] .fx,svg:target .fx{filter:none}@keyframes pulse{50%{stroke-width:4}}@media(prefers-reduced-motion:reduce){.motion{animation:none}}@media print{svg{background:#fff!important}.backdrop,.node,.aggregate{fill:#fff;stroke:#000}.label{fill:#000}.edge{stroke:#000}.motion{animation:none}.fx{filter:none}}</style>
  <rect class="backdrop" aria-hidden="true" x="0" y="0" width="720" height="360" fill="#10161d"/>
  <path class="edge" data-semantic-edge="direct-rule-dependency" data-rule-dependency="COMBAT-ENGAGEMENT-001->COMBAT-ATTACK-RESOLUTION-001" data-directed-edge="true" d="M180 45 C400 45 430 120 535 125" fill="none" stroke="#71808b" stroke-width="2" marker-end="url(#dep-arrow)"/>
  <path class="edge" data-semantic-edge="direct-rule-dependency" data-rule-dependency="COMBAT-COLLISION-001->COMBAT-ATTACK-RESOLUTION-001" data-directed-edge="true" d="M180 115 C400 115 430 130 535 135" fill="none" stroke="#71808b" stroke-width="2" marker-end="url(#dep-arrow)"/>
  <path class="edge" data-semantic-edge="direct-rule-dependency" data-rule-dependency="COMBAT-COVER-003->COMBAT-ATTACK-RESOLUTION-001" data-directed-edge="true" d="M180 185 C400 185 430 145 535 145" fill="none" stroke="#71808b" stroke-width="2" marker-end="url(#dep-arrow)"/>
  <path class="edge" data-semantic-edge="direct-rule-dependency" data-rule-dependency="COMBAT-PENETRATION-001->COMBAT-ATTACK-RESOLUTION-001" data-directed-edge="true" d="M180 255 C400 255 430 160 535 155" fill="none" stroke="#71808b" stroke-width="2" marker-end="url(#dep-arrow)"/>
  <path class="edge" data-semantic-edge="direct-rule-dependency" data-rule-dependency="COMBAT-DAMAGE-001->COMBAT-ATTACK-RESOLUTION-001" data-directed-edge="true" d="M390 45 C460 45 480 155 535 165" fill="none" stroke="#71808b" stroke-width="2" marker-end="url(#dep-arrow)"/>
  <path class="edge" data-semantic-edge="direct-rule-dependency" data-rule-dependency="COMBAT-WOUND-001->COMBAT-ATTACK-RESOLUTION-001" data-directed-edge="true" d="M390 115 C460 115 480 165 535 175" fill="none" stroke="#71808b" stroke-width="2" marker-end="url(#dep-arrow)"/>
  <path class="edge" data-semantic-edge="direct-rule-dependency" data-rule-dependency="COMBAT-SUPPRESSION-001->COMBAT-ATTACK-RESOLUTION-001" data-directed-edge="true" d="M390 185 C460 185 480 180 535 185" fill="none" stroke="#71808b" stroke-width="2" marker-end="url(#dep-arrow)"/>
  <path class="edge" data-semantic-edge="direct-rule-dependency" data-rule-dependency="COMBAT-COLLATERAL-001->COMBAT-ATTACK-RESOLUTION-001" data-directed-edge="true" d="M390 255 C460 255 480 195 535 195" fill="none" stroke="#71808b" stroke-width="2" marker-end="url(#dep-arrow)"/>
  <g aria-label="The eight direct dependencies declared by the rule catalogue" fill="#28343d" stroke="#53b7ff" stroke-width="2"><rect class="node" x="20" y="24" width="160" height="42" rx="8"/><text class="label" x="36" y="50" fill="#f7f9fa" stroke="none">ENGAGEMENT-001</text><rect class="node" x="20" y="94" width="160" height="42" rx="8"/><text class="label" x="39" y="120" fill="#f7f9fa" stroke="none">COLLISION-001</text><rect class="node" x="20" y="164" width="160" height="42" rx="8"/><text class="label" x="53" y="190" fill="#f7f9fa" stroke="none">COVER-003</text><rect class="node" x="20" y="234" width="160" height="42" rx="8"/><text class="label" x="31" y="260" fill="#f7f9fa" stroke="none">PENETRATION-001</text><rect class="node" x="230" y="24" width="160" height="42" rx="8"/><text class="label" x="263" y="50" fill="#f7f9fa" stroke="none">DAMAGE-001</text><rect class="node" x="230" y="94" width="160" height="42" rx="8"/><text class="label" x="267" y="120" fill="#f7f9fa" stroke="none">WOUND-001</text><rect class="node" x="230" y="164" width="160" height="42" rx="8"/><text class="label" x="243" y="190" fill="#f7f9fa" stroke="none">SUPPRESSION-001</text><rect class="node" x="230" y="234" width="160" height="42" rx="8"/><text class="label" x="247" y="260" fill="#f7f9fa" stroke="none">COLLATERAL-001</text></g>
  <g aria-label="Aggregate attack resolution rule"><rect class="aggregate motion fx" x="535" y="110" width="165" height="90" rx="15" fill="#3a2447" stroke="#d792ff" stroke-width="3"/><text class="label" x="545" y="160" font-size="11" fill="#f7f9fa">ATTACK RESOLUTION 001</text></g>
  <text class="label" x="20" y="330" fill="#f7f9fa">Registry-direct arrows only; execution and explanation order are separate.</text>
</svg>
