<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="dependency-title dependency-desc" data-diagram="rule-dependency" data-effects="progressive">
  <title id="dependency-title">The aggregate attack depends on trace, collision, cover, penetration, damage, wound, suppression, and collateral rules</title>
  <desc id="dependency-desc">A directed acyclic dependency view flows from trace and engagement through collision, cover, penetration, damage, and consequence rules into aggregate attack resolution. Explanation order is not dependency order.</desc>
  <defs><filter id="dependency-glow"><feColorMatrix values="1 0 0 0 .1 0 1 0 0 .2 0 0 1 0 .3 0 0 0 1 0"/></filter><marker id="dep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#71808b"/></marker></defs>
  <style>svg{background:#10161d;font:13px system-ui}.node{fill:#28343d;stroke:#53b7ff;stroke-width:2}.aggregate{fill:#3a2447;stroke:#d792ff;stroke-width:3}.label{fill:#f7f9fa}.edge{stroke:#71808b;stroke-width:2;fill:none;marker-end:url(#dep-arrow)}.motion{animation:pulse 2.4s ease-in-out infinite}.fx{filter:url(#dependency-glow)}[data-effects="off"] .fx{filter:none}@keyframes pulse{50%{stroke-width:4}}@media(prefers-reduced-motion:reduce){.motion{animation:none}}@media print{svg{background:#fff}.label{fill:#000}.motion{animation:none}.fx{filter:none}}</style>
  <g aria-label="Trace and engagement inputs"><rect class="node" x="26" y="34" width="142" height="42" rx="8"/><text class="label" x="53" y="60">TRACE-002</text><rect class="node" x="26" y="166" width="142" height="42" rx="8"/><text class="label" x="39" y="192">ENGAGEMENT-001</text></g>
  <g aria-label="Collision cover and penetration chain"><rect class="node" x="214" y="34" width="142" height="42" rx="8"/><text class="label" x="233" y="60">COLLISION-001</text><rect class="node" x="214" y="100" width="142" height="42" rx="8"/><text class="label" x="246" y="126">COVER-003</text><rect class="node" x="214" y="166" width="142" height="42" rx="8"/><text class="label" x="225" y="192">PENETRATION-001</text></g>
  <g aria-label="Damage and consequence rules"><rect class="node" x="402" y="34" width="142" height="42" rx="8"/><text class="label" x="432" y="60">DAMAGE-001</text><rect class="node" x="402" y="100" width="142" height="42" rx="8"/><text class="label" x="416" y="126">WOUND / SUPPRESS</text><rect class="node" x="402" y="166" width="142" height="42" rx="8"/><text class="label" x="417" y="192">COLLATERAL-001</text></g>
  <g aria-label="Aggregate attack resolution"><rect class="aggregate motion fx" x="580" y="82" width="120" height="92" rx="15"/><text class="label" x="595" y="112">ATTACK</text><text class="label" x="591" y="134">RESOLUTION</text><text class="label" x="615" y="156">001</text></g>
  <path class="edge" d="M168 55 H214 M168 187 H214 M285 76 V100 M285 142 V166 M356 55 H402 M356 121 H402 M356 187 H402 M544 55 L580 105 M544 121 H580 M544 187 L580 151"/>
  <text class="label" x="26" y="242">Arrows are direct dependencies; handbook explanation order is a separate list.</text>
</svg>
