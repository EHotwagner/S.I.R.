<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="invariant-title invariant-desc" data-diagram="invariant-boundary" data-effects="progressive">
  <title id="invariant-title">An invariant encloses every reachable bounded combat state</title>
  <desc id="invariant-desc">A blue safe region contains reachable states whose health, suppression, and cover remain within zero and one hundred and whose incapacity matches zero health. A red mutated transition escapes to health minus one and becomes a counterexample.</desc>
  <defs><filter id="boundary-glow"><feGaussianBlur stdDeviation="4"/></filter><marker id="boundary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff6b6b"/></marker></defs>
  <style>svg{background:#10161d;font:14px system-ui}.region{fill:#183b50;stroke:#53b7ff;stroke-width:4}.state{fill:#28343d;stroke:#f7f9fa;stroke-width:2}.bad{fill:#4b2025;stroke:#ff6b6b;stroke-width:4}.label{fill:#f7f9fa}.escape{stroke:#ff6b6b;stroke-width:4;fill:none;marker-end:url(#boundary-arrow)}.motion{stroke-dasharray:10 7;animation:escape 2s linear infinite}.fx{filter:url(#boundary-glow)}[data-effects="off"] .fx{filter:none}@keyframes escape{to{stroke-dashoffset:-34}}@media(prefers-reduced-motion:reduce){.motion{animation:none}}@media print{svg{background:#fff}.label{fill:#000}.motion{animation:none}.fx{filter:none}}</style>
  <g aria-label="Safe invariant region"><rect class="region" x="32" y="28" width="478" height="194" rx="68"/><text class="label" x="68" y="62">boundedCombatState ∧ incapacityMatchesHealth</text><circle class="state" cx="130" cy="132" r="34"/><text class="label" x="105" y="129">100 HP</text><text class="label" x="111" y="149">active</text><circle class="state" cx="280" cy="132" r="34"/><text class="label" x="263" y="129">20 HP</text><text class="label" x="261" y="149">wound</text><circle class="state" cx="430" cy="132" r="34"/><text class="label" x="418" y="129">0 HP</text><text class="label" x="393" y="149">incapacitated</text></g>
  <g aria-label="Mutated counterexample outside invariant"><circle class="bad fx" cx="640" cy="132" r="42"/><text class="label" x="612" y="129">−1 HP</text><text class="label" x="595" y="151">counterexample</text></g>
  <path class="escape motion" d="M464 132 H592"/><text class="label" x="500" y="113">mutated bound</text>
  <text class="label" x="62" y="241">The property quantifies over reachable model states; the diagram does not add a new state or rule.</text>
</svg>
