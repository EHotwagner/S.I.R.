<svg xmlns="http://www.w3.org/2000/svg" id="effects-off" viewBox="0 0 720 280" role="img" aria-labelledby="trace-title trace-desc" data-diagram="trace-counterexample" data-effects="progressive" font-family="system-ui" font-size="14" style="background:#10161d">
  <title id="trace-title">Original and mutated transition systems produce separate traces</title>
  <desc id="trace-desc">The original model's representative trace reaches damage twenty and health eighty. The established armor-retention mutation from 8000 to 7000 defines a different transition system whose reachable trace has damage eighteen and health eighty-two. The two executions are not nondeterministic branches of one model.</desc>
  <defs><filter id="trace-glow"><feGaussianBlur stdDeviation="3"/></filter><marker id="trace-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#71808b"/></marker></defs>
  <style>svg{background:#10161d;font:14px system-ui}.boundary{fill:#18232c;stroke:#71808b;stroke-width:2}.state{fill:#28343d;stroke:#71808b;stroke-width:3}.safe{stroke:#53b7ff}.bad{stroke:#ff6b6b}.label{fill:#f7f9fa}.edge{fill:none;stroke:#71808b;stroke-width:3;marker-end:url(#trace-arrow)}.motion{stroke-dasharray:9 6;animation:walk 2s linear infinite}.fx{filter:url(#trace-glow)}[data-effects="off"] .fx,svg:target .fx{filter:none}@keyframes walk{to{stroke-dashoffset:-30}}@media(prefers-reduced-motion:reduce){.motion{animation:none}}@media print{svg{background:#fff!important}.backdrop,.boundary,.state{fill:#fff;stroke:#000}.label{fill:#000}.edge,.safe,.bad{stroke:#000}.motion{animation:none}.fx{filter:none}}</style>
  <rect class="backdrop" aria-hidden="true" x="0" y="0" width="720" height="280" fill="#10161d"/>
  <g aria-label="Original model witness trace"><rect class="boundary" x="24" y="30" width="320" height="190" rx="18" fill="#18232c" stroke="#71808b" stroke-width="2"/><circle class="state" cx="92" cy="130" r="36" fill="#28343d" stroke="#71808b" stroke-width="3"/><circle class="state safe" cx="278" cy="130" r="58" fill="#28343d" stroke="#53b7ff" stroke-width="3"/><text class="label" x="42" y="58" fill="#f7f9fa">ORIGINAL MODEL</text><text class="label" x="73" y="135" fill="#f7f9fa">s0</text><text class="label" x="232" y="126" font-size="10" fill="#f7f9fa">damage 20 · HP 80</text><text class="label" x="253" y="147" font-size="10" fill="#f7f9fa">property ✓</text></g>
  <path class="edge" data-semantic-edge="original-model-trace" data-directed-edge="true" d="M128 130 H220" fill="none" stroke="#53b7ff" stroke-width="3" marker-end="url(#trace-arrow)"/>
  <g aria-label="Mutated model counterexample trace"><rect class="boundary" x="376" y="30" width="320" height="190" rx="18" fill="#18232c" stroke="#71808b" stroke-width="2"/><circle class="state" cx="444" cy="130" r="36" fill="#28343d" stroke="#71808b" stroke-width="3"/><circle class="state bad fx" cx="630" cy="130" r="58" fill="#28343d" stroke="#ff6b6b" stroke-width="3"/><text class="label" x="394" y="58" fill="#f7f9fa">MUTATED MODEL</text><text class="label" x="425" y="135" fill="#f7f9fa">s0</text><text class="label" x="588" y="120" font-size="9" fill="#f7f9fa">7000 → damage 18</text><text class="label" x="616" y="140" font-size="9" fill="#f7f9fa">HP 82</text><text class="label" x="608" y="158" font-size="9" fill="#f7f9fa">property ✕</text></g>
  <path class="edge bad motion" data-semantic-edge="mutated-model-counterexample-trace" data-directed-edge="true" d="M480 130 H572" fill="none" stroke="#ff6b6b" stroke-width="3" marker-end="url(#trace-arrow)"/>
  <text class="label" x="75" y="254" font-size="11" fill="#f7f9fa">An altered model is a separate transition system, not a branch of the original execution.</text>
</svg>
