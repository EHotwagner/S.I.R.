<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="trace-title trace-desc" data-diagram="trace-counterexample" data-effects="progressive">
  <title id="trace-title">A nondeterministic trace branches; a counterexample marks the first violating transition</title>
  <desc id="trace-desc">Initial state zero branches to two reachable executions. The upper witness reaches damage twenty and remains safe. The lower counterexample reaches damage eighteen after a mutated armor step; the red edge is the first divergence, not proof that every execution fails.</desc>
  <defs><filter id="trace-glow"><feGaussianBlur stdDeviation="3"/></filter><marker id="trace-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#71808b"/></marker></defs>
  <style>svg{background:#10161d;font:14px system-ui}.state{fill:#28343d;stroke:#71808b;stroke-width:3}.safe{stroke:#53b7ff}.bad{stroke:#ff6b6b}.label{fill:#f7f9fa}.edge{fill:none;stroke:#71808b;stroke-width:3;marker-end:url(#trace-arrow)}.motion{stroke-dasharray:9 6;animation:walk 2s linear infinite}.fx{filter:url(#trace-glow)}[data-effects="off"] .fx{filter:none}@keyframes walk{to{stroke-dashoffset:-30}}@media(prefers-reduced-motion:reduce){.motion{animation:none}}@media print{svg{background:#fff}.label{fill:#000}.motion{animation:none}.fx{filter:none}}</style>
  <g aria-label="Initial state"><circle class="state" cx="90" cy="125" r="42"/><text class="label" x="69" y="122">s0</text><text class="label" x="55" y="143">damage 0</text></g>
  <g aria-label="Safe witness branch"><circle class="state safe" cx="315" cy="65" r="42"/><text class="label" x="294" y="62">s1</text><text class="label" x="278" y="83">trace valid</text><circle class="state safe" cx="570" cy="65" r="42"/><text class="label" x="549" y="62">s2</text><text class="label" x="532" y="83">damage 20</text></g>
  <g aria-label="Counterexample branch"><circle class="state" cx="315" cy="190" r="42"/><text class="label" x="294" y="187">c1</text><text class="label" x="276" y="208">trace valid</text><circle class="state bad fx" cx="570" cy="190" r="42"/><text class="label" x="549" y="187">c2</text><text class="label" x="532" y="208">damage 18</text></g>
  <path class="edge motion" d="M130 110 L274 76 M130 140 L274 179 M357 65 H526"/><path class="edge bad motion" d="M357 190 H526"/>
  <text class="label" x="418" y="172">first divergence</text><text class="label" x="410" y="235">one reachable counterexample; not a universal execution claim</text>
</svg>
